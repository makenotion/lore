version: 1
runner: skill-retrieval
name: skillret-notion-ai
description: >
  SkillRet public test split scored through the persistent Notion-backed
  SkillRet eval vault. The suite expects the registered vault and
  `manifests/skillret-test-import.json` to already exist. Import is a one-time
  vault setup step, not part of routine eval runs.
corpus:
  kind: skillret
  root: corpora/skillret
  split: test
document:
  textFields:
    - name
    - description
    - skill_md
notion:
  projectName: SkillRet Eval
  topicName: SkillRet Test Split
  importManifestPath: manifests/skillret-test-import.json
  expectedVaultPageId: 374b35e6-e67f-8108-beb4-dec11f2f5d28
  requireRunToolAi: true
  taxonomyTopics: true
  searchTopicScoped: false
  queryDelayMs: 1000
queries:
  seed: skillret-notion-ai-v1
lanes:
  - notion-ai
k:
  - 1
  - 5
  - 10
retrieval:
  limit: 10
