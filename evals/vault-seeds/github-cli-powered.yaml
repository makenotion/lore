        constraint without writing config or secure-storage state.
      scenarios:
        - gh-cli-auth-switch-dry-run-json-status
      sourcePullRequests: []
    - id: gh-cli/pr-merge-queue-plan-json
      title: PR merge planning chooses a mutation family before execution
      topics: ["commands/pr-issue", "output/json", "tests/commands", "api/http"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        PR merge behavior branches among direct merge, auto-merge, merge queue,
        already-queued, and admin-bypass paths.
      body: |
        `gh pr merge` resolves pull request state, branch requirements,
        strategy flags, branch deletion, and admin behavior before executing a
        mutation. Non-mutating output should reflect those existing inputs
        without changing the merge path.
      scenarios:
        - gh-cli-pr-merge-queue-plan-json
      sourcePullRequests: []
    - id: gh-cli/codespace-ports-visibility-file-plan
