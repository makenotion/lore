    - id: gh-cli/api-graphql-paginate-field
      title: GraphQL pagination needs explicit connection selection
      topics: ["api/http", "output/json", "tests/commands"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        GraphQL pagination can pick the wrong cursor when a response contains
        multiple pageInfo blocks.
      body: |
        `gh api graphql --paginate` should keep the default cursor discovery
        stable, but complex GraphQL responses need a way to select a specific
        connection path under `data`. The selected path has to compose with
        `--slurp`, jq/template output, and existing cursor variable injection,
        and should fail clearly when the path is absent or not a connection.
      scenarios:
        - gh-cli-api-graphql-paginate-field
      sourcePullRequests: []
    - id: gh-cli/skills-install-transactional-lockfile
      title: Skill installs should publish files and lockfile entries atomically
      topics: ["commands/skills", "tests/commands", "cli/ux"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Skill install/update should stage remote skill files before final
        publish and should record lockfile entries only after success.
      body: |
        Remote skill installation crosses discovery, download, metadata
        injection, symlink and traversal guards, and lockfile persistence. To
        avoid corrupting existing installs, prepare each skill in a temporary
        location, publish the final directory atomically, and record the
        lockfile only after the published directory is valid. Multi-skill
        installs should allow successful siblings to complete without stale
        lockfile entries for failed siblings.
      scenarios:
        - gh-cli-skills-install-transactional-lockfile
      sourcePullRequests: []
    - id: gh-cli/pr-status-head-repo-disambiguation
      title: PR status current-branch matching needs qualified head refs
      topics: ["commands/pr-issue", "tests/commands", "output/json"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Current-branch PR status should distinguish fork head refs from base
        repository branches with the same name.
      body: |
        `gh pr status` can see multiple pull requests with the same head branch
        name. Current-branch selection should preserve the qualified head ref or
        head repository owner until selection is complete, then share that
        result between human and JSON output. Explicit `--repo` should keep the
        selected repository's behavior rather than inventing a local branch
        match from a different fork owner.
      scenarios:
        - gh-cli-pr-status-head-repo-disambiguation
      sourcePullRequests: []
    - id: gh-cli/release-create-generated-notes-target-rollback
      title: Release create ordering ties notes, target, verify-tag, and cleanup
      topics: ["commands/release", "api/http", "tests/commands"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Release creation should keep generated-notes payloads, target
        commitish, verify-tag checks, and draft cleanup in a stable order.
      body: |
        Release creation with generated notes and assets crosses multiple REST
        calls. Verify-tag checks should fail before generated-notes requests,
        generated-notes and create-release payloads should use the same target
        commitish and notes start tag, and draft cleanup after asset upload
        failures should surface cleanup errors without hiding the original
        failure context.
      scenarios:
        - gh-cli-release-create-generated-notes-target-rollback
      sourcePullRequests: []
    - id: gh-cli/agent-task-create-wait-exit-status
      title: Agent task create wait mode should reuse CAPI polling seams
      topics: ["commands/agent-task", "tests/commands", "cli/ux"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Agent task creation already has injectable CAPI, backoff, sleep, and log
        rendering seams that can support wait and exit-status behavior.
      body: |
        Agent task create flows should keep immediate create behavior separate
        from wait mode. Wait mode should poll through injected CAPI and
        sleep/backoff seams, support timeout, render terminal session output,
        and map failed or cancelled terminal states to non-zero exits only when
        exit-status behavior is requested.
      scenarios:
        - gh-cli-agent-task-create-wait-exit-status
      sourcePullRequests: []
    - id: gh-cli/ruleset-check-json-export
      title: Ruleset check JSON should reuse branch resolution and shared models
      topics: ["commands/ruleset", "output/json", "tests/commands"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Ruleset check can expose machine-readable fields without changing its
        branch resolution or REST request boundaries.
      body: |
        Ruleset check already resolves current/default branch context and uses
        shared REST models. JSON output should export the checked ref, matching
        rulesets, enforcement/bypass data, and rule details from the same data
        used by human output. Web mode and JSON mode should be mutually
        exclusive, and tests should keep URL-escaped branch request paths
        stable.
      scenarios:
        - gh-cli-ruleset-check-json-export
      sourcePullRequests: []
    - id: gh-cli/attestation-verify-oci-platform-index
      title: OCI attestation verification should expand indexes by platform
      topics: ["commands/attestation", "commands/release", "tests/commands"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        OCI image index verification should select platform manifest digests
        before applying existing attestation policy.
      body: |
        OCI attestation verification should resolve an image index into the
        platform manifests selected by the command. Without a platform selector,
        verify every manifest in the index and fail if any selected digest lacks
        a valid attestation. With a platform selector, verify only the matching
        digest and report a clear no-match error. Single-manifest and file
        artifact behavior should remain unchanged.
      scenarios:
        - gh-cli-attestation-verify-oci-platform-index
      sourcePullRequests: []
