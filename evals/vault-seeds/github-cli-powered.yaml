    - id: gh-cli/secret-variable-env-file-plan-shared
      title: Secret and variable env-file imports share planning but not writes
      topics:
        [
          "commands/secret",
          "commands/variable",
          "output/json",
          "tests/commands",
          "api/http",
        ]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Secret and variable dotenv imports share parsing and target planning
        while differing in encryption and write behavior.
      body: |
        `gh secret set -f` and `gh variable set -f` both parse dotenv-style
        input and resolve repo, org, environment, and selected-repository
        targets. Secret planning must keep public-key lookup and encryption out
        of non-mutating paths, while variable planning still needs to model
        visibility and target scope.
      scenarios:
        - gh-cli-secret-variable-env-file-plan-shared
      sourcePullRequests: []
    - id: gh-cli/auth-switch-dry-run-json-status
