      provenanceKind: generalized
      synopsis: >-
        PR review mutations already combine resolved PR context, review event,
        body text, and GraphQL payload construction.
      body: |
        Inline PR review feedback needs PR file-list validation before mutation
        and should keep reply-thread behavior separate from top-level review
        event submission. Review tests typically assert GraphQL operation shape
        through httpmock rather than relying only on output strings.
      scenarios:
        - gh-cli-pr-review-inline-comments
