    - id: gh-cli/variable-ambiguous-remote-scope
      title: Variable commands should share secret command remote ambiguity policy
      topics: ["commands/variable", "commands/secret", "tests/commands", "cli/ux"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Repository-scoped variable commands need the same ambiguous-remote
        handling as repository-scoped secret commands.
      body: |
        Repository-scoped variable commands should use the same local repository
        disambiguation policy as secret commands: noninteractive runs fail when
        multiple remotes are plausible, interactive runs can prompt, and
        explicit repository, organization, and environment scopes bypass local
        remote ambiguity. Tests should cover constructor wiring and request
        routing across list, get, set, and delete.
      scenarios:
        - gh-cli-variable-ambiguous-remote-scope
