      sourcePullRequests: []
    - id: gh-cli/extension-upgrade-atomic-all
      title: Extension all-upgrade needs manager-level rollback accounting
      topics: ["commands/extension", "output/json", "tests/commands", "cli/ux"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Extension upgrade orchestration separates discovery, pinned policy, git
        operations, filesystem manager work, and result summaries.
      body: |
        Extension upgrade command code coordinates extension discovery and
        output while the manager layer owns filesystem and git operations.
        Tests usually assert per-extension results through manager fakes.
      scenarios:
        - gh-cli-extension-upgrade-atomic-all
      sourcePullRequests: []
    - id: gh-cli/output-redaction-pipeline
      title: Output writers are the boundary for cross-command redaction
      topics: ["output/json", "tests/commands", "cli/ux"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        iostreams composes command output writers before human and JSON output
        reach stdout or stderr.
      body: |
        Most command packages write human and JSON output through `iostreams`
        rather than directly to process streams. Cross-cutting output behavior
        belongs in writer composition, while commands that intentionally emit
        raw token material need explicit output paths that are easy to audit.
      scenarios:
        - gh-cli-output-redaction-pipeline
      sourcePullRequests: []
    - id: gh-cli/workflow-lint-local
      title: Offline workflow commands use local YAML structure and fixtures
      topics: ["commands/workflow", "tests/commands", "cli/ux"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Workflow command packages are normally API-backed, but local workflow
        files can be validated without network access.
      body: |
        Workflow subcommands live under a shared command group and usually load
        workflow data through GitHub APIs. Offline validators should use
        package-local fixtures, preserve YAML source positions for diagnostics,
        and keep usage errors separate from validation failures.
      scenarios:
        - gh-cli-workflow-lint-local
      sourcePullRequests: []
    - id: gh-cli/http-read-cache-middleware
      title: Read-through HTTP caching belongs in the transport chain
      topics: ["commands/cache", "api/http", "tests/commands"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        API clients compose transports before command code receives responses,
        while the cache command group currently has an Actions-cache scope.
      body: |
        HTTP read caching should be inserted in the API transport stack so
        command packages keep their request logic. Cache management commands
        need clear namespace separation from Actions cache commands, and cache
        keys must avoid persisting bearer token material.
      scenarios:
        - gh-cli-http-read-cache-middleware
      sourcePullRequests: []
    - id: gh-cli/search-query-file-shared
      title: Search commands share immutable raw query construction
      topics: ["commands/search", "tests/commands", "api/http", "cli/ux"]
      confidence: medium
      provenanceKind: generalized
      synopsis: >-
        Search subcommands compose positional keywords, raw syntax, qualifier
        flags, and web URLs through shared query construction.
      body: |
        Search features that accept raw query syntax should preserve that query
        through the immutable keyword path while still composing with structured
        qualifier flags. File or stdin input should be normalized before the
        shared query builder so search issues, PRs, and code stay consistent.
      scenarios:
        - gh-cli-search-query-file-shared
