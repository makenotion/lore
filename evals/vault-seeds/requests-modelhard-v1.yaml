description: >-
  Model-hard seed corpus for a Requests longitudinal suite. Entries model
  durable redirect-handling findings that reproduce obscure RFC behavior almost
  no implementation gets right unprompted, pinned at a Requests revision before
  the matching upstream fix.
repository:
