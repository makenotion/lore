        before linked-branch mutations or git side effects and preserve valid
        branch names.
      keywords:
        - issue develop
        - refname
        - branch
        - GraphQL
        - git
    seededContext:
      renderedContext: |
        - [memory] gh-cli/issue-develop-ref-validation: Branch names accepted by `gh issue develop --name`, `--base`, and linked-branch API responses should be checked with Git refname rules before creating linked branches, setting branch config, fetching, or checking out. Reject colon, `..`, `@{`, leading dash, trailing slash or dot, control characters, and other invalid ref forms. Valid slash-containing names remain supported and should be passed as argv arguments.
