  - id: gh-cli-auth-git-credential-requested-user-v3
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace: &github_cli_workspace
      kind: git
      repo: cli/cli
      sha: 9a593ce81b593dee752cc11737d1a3ef768e52b3
    phaseA:
      promptId: gh-cli-auth-git-credential-requested-user-v3-formation
      prompt: >-
        We will implement a follow-up auth credential-helper fix in a later
        session. Inspect `gh auth git-credential`, multi-account auth config,
        gist host fallback, environment-token precedence, and the package tests.
        Produce a durable implementation plan only; do not edit files. The plan
        should resolve how Git-provided usernames interact with inactive stored
        accounts without switching the active account.
    phaseB:
      promptId: gh-cli-auth-git-credential-requested-user-v3-use
      prompt: Implement the auth credential-helper follow-up exactly as planned in the prior investigation.
    expectedContext:
      description: >-
        The credential helper should honor requested stored users, preserve
        active-user behavior when no username is supplied, keep gist host
        fallback, and preserve env-token semantics.
      keywords:
        - git-credential
        - username
        - inactive
        - gist
        - x-access-token
    seededContext:
      renderedContext: |
        - [memory] gh-cli/auth-git-credential-requested-user: `gh auth git-credential get` can use the Git credential username as a per-host account selector without switching the active account. Preserve active-user fallback when no username is supplied, keep environment-sourced tokens as `x-access-token`, keep gist host lookup against `github.com` while echoing the requested gist host, and silently miss unknown requested users.
      contextIds:
        - gh-cli/auth-git-credential-requested-user
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/pkg/cmd/auth/gitcredential/helper_hidden_test.go b/pkg/cmd/auth/gitcredential/helper_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/pkg/cmd/auth/gitcredential/helper_hidden_test.go
          @@ -0,0 +1,105 @@
          +package login
          +
          +import (
          +	"fmt"
          +	"sort"
          +	"testing"
          +
          +	"github.com/MakeNowJust/heredoc"
          +	"github.com/cli/cli/v2/pkg/iostreams"
          +	"github.com/stretchr/testify/assert"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +type hiddenMultiUserConfig struct {
          +	activeUser string
          +	source     string
          +	tokens     map[string]string
          +}
          +
          +func hiddenTokenKey(host, user string) string {
          +	return host + ":" + user
          +}
          +
          +func (c *hiddenMultiUserConfig) ActiveToken(host string) (string, string) {
          +	return c.tokens[hiddenTokenKey(host, c.activeUser)], c.source
          +}
          +
          +func (c *hiddenMultiUserConfig) ActiveUser(string) (string, error) {
          +	return c.activeUser, nil
          +}
          +
          +func (c *hiddenMultiUserConfig) TokenForUser(host, user string) (string, string, error) {
          +	token := c.tokens[hiddenTokenKey(host, user)]
          +	if token == "" {
          +		return "", "default", fmt.Errorf("no token found for %s", user)
          +	}
          +	return token, c.source, nil
          +}
          +
          +func (c *hiddenMultiUserConfig) UsersForHost(host string) []string {
          +	var users []string
          +	prefix := host + ":"
          +	for key := range c.tokens {
          +		if len(key) > len(prefix) && key[:len(prefix)] == prefix {
          +			users = append(users, key[len(prefix):])
          +		}
          +	}
          +	sort.Strings(users)
          +	return users
          +}
          +
          +func runHiddenCredential(t *testing.T, input string, cfg config) (string, error) {
          +	t.Helper()
          +	ios, stdin, stdout, _ := iostreams.Test()
          +	_, _ = stdin.WriteString(input)
          +	err := helperRun(&CredentialOptions{
          +		IO:        ios,
          +		Operation: "get",
          +		Config: func() (config, error) {
          +			return cfg, nil
          +		},
          +	})
          +	return stdout.String(), err
          +}
          +
          +func TestHiddenCredentialHelperUsesRequestedInactiveUser(t *testing.T) {
          +	cfg := &hiddenMultiUserConfig{
          +		activeUser: "monalisa",
          +		source:     "/home/monalisa/.config/gh/hosts.yml",
          +		tokens: map[string]string{
          +			hiddenTokenKey("github.com", "monalisa"): "MONA_TOKEN",
          +			hiddenTokenKey("github.com", "hubot"):    "HUBOT_TOKEN",
          +		},
          +	}
          +
          +	out, err := runHiddenCredential(t, heredoc.Doc(`
          +		protocol=https
          +		host=github.com
          +		username=hubot
          +	`), cfg)
          +
          +	require.NoError(t, err)
          +	assert.Equal(t, heredoc.Doc(`
          +		protocol=https
          +		host=github.com
          +		username=hubot
          +		password=HUBOT_TOKEN
          +	`), out)
          +	assert.Equal(t, "monalisa", cfg.activeUser)
          +}
          +
          +func TestHiddenCredentialHelperUsesRequestedUserForGistHost(t *testing.T) {
          +	cfg := &hiddenMultiUserConfig{
          +		activeUser: "monalisa",
          +		source:     "/home/monalisa/.config/gh/hosts.yml",
          +		tokens: map[string]string{
          +			hiddenTokenKey("github.com", "monalisa"): "MONA_TOKEN",
          +			hiddenTokenKey("github.com", "hubot"):    "HUBOT_TOKEN",
          +		},
          +	}
          +
          +	out, err := runHiddenCredential(t, "url=https://hubot@gist.github.com/OWNER/secret\n\n", cfg)
          +
          +	require.NoError(t, err)
          +	assert.Equal(t, heredoc.Doc(`
          +		protocol=https
          +		host=gist.github.com
          +		username=hubot
          +		password=HUBOT_TOKEN
          +	`), out)
          +}
          +
          +func TestHiddenCredentialHelperSilentlyMissesUnknownRequestedUser(t *testing.T) {
          +	cfg := &hiddenMultiUserConfig{
          +		activeUser: "monalisa",
          +		source:     "/home/monalisa/.config/gh/hosts.yml",
          +		tokens: map[string]string{
          +			hiddenTokenKey("github.com", "monalisa"): "MONA_TOKEN",
          +		},
          +	}
          +
          +	out, err := runHiddenCredential(t, "protocol=https\nhost=github.com\nusername=hubot\n\n", cfg)
          +
          +	require.Error(t, err)
          +	assert.Empty(t, out)
          +}
        command: go
        args:
          - test
          - ./pkg/cmd/auth/gitcredential
          - -count=1
        timeoutMs: 300000

  - id: gh-cli-run-download-zip-safe-atomic-v3
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace: *github_cli_workspace
    phaseA:
      promptId: gh-cli-run-download-zip-safe-atomic-v3-formation
      prompt: >-
        We will implement a workflow-run artifact download safety follow-up in a
        later session. Inspect `gh run download`, `apiPlatform.Download`, the
        shared ZIP extraction helper, safepaths behavior, and tests. Produce a
        durable implementation plan only; do not edit files. The plan should
        resolve validation-before-write behavior, path traversal, duplicate
        entries, symlink/special modes, staging/rollback, and executable-bit
        preservation.
    phaseB:
      promptId: gh-cli-run-download-zip-safe-atomic-v3-use
      prompt: Implement the workflow-run artifact ZIP safety follow-up exactly as planned in the prior investigation.
    expectedContext:
      description: >-
        Artifact ZIP extraction should validate all entries before writing,
        reject unsafe entries, use staging for rollback, and preserve valid
        executable files.
      keywords:
        - zip
        - traversal
        - duplicate
        - symlink
        - staging
    seededContext:
      renderedContext: |
        - [memory] gh-cli/run-artifact-zip-safe-atomic: `gh run download` should validate the full artifact ZIP entry set before writing any destination files. Reject path traversal, absolute paths, symlink or special file modes, and duplicate destination entries. Extract through a staging directory so a failure leaves the destination unchanged, while preserving executable bits for valid files.
      contextIds:
        - gh-cli/run-artifact-zip-safe-atomic
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/internal/zip/zip_hidden_test.go b/internal/zip/zip_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/internal/zip/zip_hidden_test.go
          @@ -0,0 +1,106 @@
          +package zip
          +
          +import (
          +	"archive/zip"
          +	"bytes"
          +	"os"
          +	"path/filepath"
          +	"testing"
          +
          +	"github.com/cli/cli/v2/internal/safepaths"
          +	"github.com/stretchr/testify/assert"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +type hiddenZipEntry struct {
          +	name string
          +	body string
          +	mode os.FileMode
          +}
          +
          +func hiddenZipReader(t *testing.T, entries ...hiddenZipEntry) *zip.Reader {
          +	t.Helper()
          +	var buf bytes.Buffer
          +	zw := zip.NewWriter(&buf)
          +	for _, entry := range entries {
          +		header := &zip.FileHeader{Name: entry.name, Method: zip.Deflate}
          +		if entry.mode != 0 {
          +			header.SetMode(entry.mode)
          +		}
          +		w, err := zw.CreateHeader(header)
          +		require.NoError(t, err)
          +		_, err = w.Write([]byte(entry.body))
          +		require.NoError(t, err)
          +	}
          +	require.NoError(t, zw.Close())
          +	reader := bytes.NewReader(buf.Bytes())
          +	zr, err := zip.NewReader(reader, int64(buf.Len()))
          +	require.NoError(t, err)
          +	return zr
          +}
          +
          +func hiddenDest(t *testing.T) safepaths.Absolute {
          +	t.Helper()
          +	dest, err := safepaths.ParseAbsolute(filepath.Join(t.TempDir(), "artifact"))
          +	require.NoError(t, err)
          +	return dest
          +}
          +
          +func TestHiddenExtractZipRejectsTraversalBeforeWriting(t *testing.T) {
          +	dest := hiddenDest(t)
          +	err := ExtractZip(hiddenZipReader(t,
          +		hiddenZipEntry{name: "good.txt", body: "ok"},
          +		hiddenZipEntry{name: "../escape.txt", body: "bad"},
          +	), dest)
          +
          +	require.Error(t, err)
          +	assert.Contains(t, err.Error(), "../escape.txt")
          +	assert.NoFileExists(t, filepath.Join(dest.String(), "good.txt"))
          +	assert.NoFileExists(t, filepath.Join(filepath.Dir(dest.String()), "escape.txt"))
          +}
          +
          +func TestHiddenExtractZipRejectsDuplicateDestinationsAtomically(t *testing.T) {
          +	dest := hiddenDest(t)
          +	err := ExtractZip(hiddenZipReader(t,
          +		hiddenZipEntry{name: "a.txt", body: "first"},
          +		hiddenZipEntry{name: "a.txt", body: "second"},
          +	), dest)
          +
          +	require.Error(t, err)
          +	assert.Contains(t, err.Error(), "a.txt")
          +	assert.NoFileExists(t, filepath.Join(dest.String(), "a.txt"))
          +}
          +
          +func TestHiddenExtractZipRejectsSymlinkEntries(t *testing.T) {
          +	dest := hiddenDest(t)
          +	err := ExtractZip(hiddenZipReader(t,
          +		hiddenZipEntry{name: "link", body: "target", mode: os.ModeSymlink | 0777},
          +	), dest)
          +
          +	require.Error(t, err)
          +	assert.Contains(t, err.Error(), "link")
          +	assert.NoFileExists(t, filepath.Join(dest.String(), "link"))
          +}
          +
          +func TestHiddenExtractZipPreservesExecutableFiles(t *testing.T) {
          +	dest := hiddenDest(t)
          +	err := ExtractZip(hiddenZipReader(t,
          +		hiddenZipEntry{name: "bin/run.sh", body: "#!/bin/sh\n", mode: 0755},
          +	), dest)
          +
          +	require.NoError(t, err)
          +	info, err := os.Stat(filepath.Join(dest.String(), "bin", "run.sh"))
          +	require.NoError(t, err)
          +	assert.NotZero(t, info.Mode()&0111)
          +}
        command: go
        args:
          - test
          - ./internal/zip
          - -count=1
        timeoutMs: 300000

  - id: gh-cli-pr-close-delete-branch-worktree-guard-v3
