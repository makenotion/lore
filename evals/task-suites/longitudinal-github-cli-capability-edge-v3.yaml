    verifiers:
      - type: patched-command
        patch: |
          diff --git a/pkg/cmd/pr/checkout/checkout_hidden_test.go b/pkg/cmd/pr/checkout/checkout_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/pkg/cmd/pr/checkout/checkout_hidden_test.go
          @@ -0,0 +1,125 @@
          +package checkout
          +
          +import (
          +	"errors"
          +	"net/http"
          +	"testing"
          +
          +	"github.com/cli/cli/v2/context"
          +	"github.com/cli/cli/v2/git"
          +	"github.com/cli/cli/v2/internal/config"
          +	"github.com/cli/cli/v2/internal/gh"
          +	"github.com/cli/cli/v2/internal/ghrepo"
          +	"github.com/cli/cli/v2/internal/run"
          +	"github.com/cli/cli/v2/pkg/httpmock"
          +	"github.com/cli/cli/v2/pkg/iostreams"
          +	"github.com/stretchr/testify/assert"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +func hiddenCheckoutOptions(baseRepo ghrepo.Interface, prHead string, remotes map[string]string) *CheckoutOptions {
          +	_, pr := stubPR("OWNER/REPO:master", prHead)
          +	ios, _, _, _ := iostreams.Test()
          +	reg := &httpmock.Registry{}
          +	return &CheckoutOptions{
          +		IO: ios,
          +		PRResolver: &stubPRResolver{
          +			pr:       pr,
          +			baseRepo: baseRepo,
          +		},
          +		Config: func() (gh.Config, error) {
          +			return config.NewBlankConfig(), nil
          +		},
          +		HttpClient: func() (*http.Client, error) {
          +			return &http.Client{Transport: reg}, nil
          +		},
          +		Branch: func() (string, error) {
          +			return "main", nil
          +		},
          +		Remotes: func() (context.Remotes, error) {
          +			if len(remotes) == 0 {
          +				return nil, errors.New("no remotes")
          +			}
          +			var result context.Remotes
          +			for name, fullName := range remotes {
          +				repo, err := ghrepo.FromFullName(fullName)
          +				if err != nil {
          +					return nil, err
          +				}
          +				result = append(result, &context.Remote{
          +					Remote: &git.Remote{Name: name},
          +					Repo:   repo,
          +				})
          +			}
          +			return result, nil
          +		},
          +		GitClient: &git.Client{
          +			GhPath:  "some/path/gh",
          +			GitPath: "some/path/git",
          +		},
          +	}
          +}
          +
          +func TestHiddenCheckoutRejectsMalformedHeadRefBeforeGitFetch(t *testing.T) {
          +	baseRepo, _ := stubPR("OWNER/REPO:master", "OWNER/REPO:feature")
          +	_, teardown := run.Stub()
          +	defer teardown(t)
          +
          +	opts := hiddenCheckoutOptions(baseRepo, "OWNER/REPO:bad:name", map[string]string{
          +		"origin": "OWNER/REPO",
          +	})
          +	err := checkoutRun(opts)
          +
          +	require.Error(t, err)
          +	assert.Contains(t, err.Error(), "bad:name")
          +	assert.Contains(t, err.Error(), "branch")
          +}
          +
          +func TestHiddenCheckoutRejectsMalformedBranchFlagBeforeGitSideEffects(t *testing.T) {
          +	for _, branchName := range []string{"bad:name", "-danger", "feature..evil"} {
          +		t.Run(branchName, func(t *testing.T) {
          +			baseRepo, _ := stubPR("OWNER/REPO:master", "OWNER/REPO:feature")
          +			_, teardown := run.Stub()
          +			defer teardown(t)
          +			opts := hiddenCheckoutOptions(baseRepo, "OWNER/REPO:feature", map[string]string{
          +				"origin": "OWNER/REPO",
          +			})
          +			opts.BranchName = branchName
          +
          +			err := checkoutRun(opts)
          +
          +			require.Error(t, err)
          +			assert.Contains(t, err.Error(), branchName)
          +			assert.Contains(t, err.Error(), "branch")
          +		})
          +	}
          +}
          +
          +func TestHiddenCheckoutRejectsMalformedMissingRemoteLocalBranchBeforeConfig(t *testing.T) {
          +	baseRepo, _ := stubPR("OWNER/REPO:master", "OWNER/REPO:feature")
          +	_, teardown := run.Stub()
          +	defer teardown(t)
          +	opts := hiddenCheckoutOptions(baseRepo, "hubot/REPO:feature", map[string]string{
          +		"origin": "OWNER/REPO",
          +	})
          +	opts.BranchName = "topic@{upstream}"
          +
          +	err := checkoutRun(opts)
          +
          +	require.Error(t, err)
          +	assert.Contains(t, err.Error(), "topic@{upstream}")
          +	assert.Contains(t, err.Error(), "branch")
          +}
          +
          +func TestHiddenCheckoutAllowsSlashContainingHeadAndLocalBranchNames(t *testing.T) {
          +	baseRepo, _ := stubPR("OWNER/REPO:master", "OWNER/REPO:feature")
          +	cmdStubs, teardown := run.Stub()
          +	defer teardown(t)
          +	cmdStubs.Register(`git show-ref --verify -- refs/heads/local/topic/slash`, 1, "")
          +	cmdStubs.Register(`git fetch origin \+refs/heads/feature/slash:refs/remotes/origin/feature/slash --no-tags`, 0, "")
          +	cmdStubs.Register(`git checkout -b local/topic/slash --track origin/feature/slash`, 0, "")
          +	opts := hiddenCheckoutOptions(baseRepo, "OWNER/REPO:feature/slash", map[string]string{
          +		"origin": "OWNER/REPO",
          +	})
          +	opts.BranchName = "local/topic/slash"
          +
          +	require.NoError(t, checkoutRun(opts))
          +}
        command: go
        args:
          - test
          - ./pkg/cmd/pr/checkout
          - -count=1
        timeoutMs: 300000

