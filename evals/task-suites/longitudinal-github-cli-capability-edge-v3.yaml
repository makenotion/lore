    verifiers:
      - type: patched-command
        patch: |
          diff --git a/pkg/cmd/auth/refresh/refresh_hidden_test.go b/pkg/cmd/auth/refresh/refresh_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/pkg/cmd/auth/refresh/refresh_hidden_test.go
          @@ -0,0 +1,129 @@
          +package refresh
          +
          +import (
          +	"io"
          +	"net/http"
          +	"strings"
          +	"testing"
          +
          +	"github.com/cli/cli/v2/internal/config"
          +	"github.com/cli/cli/v2/internal/gh"
          +	"github.com/cli/cli/v2/pkg/httpmock"
          +	"github.com/cli/cli/v2/pkg/iostreams"
          +	"github.com/stretchr/testify/assert"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +func hiddenRefreshOptions(
          +	t *testing.T,
          +	oldScopes string,
          +	mutate func(*RefreshOptions),
          +) (*RefreshOptions, *[]string, *httpmock.Registry) {
          +	t.Helper()
          +	cfg, _ := config.NewIsolatedTestConfig(t)
          +	_, err := cfg.Authentication().Login("github.com", "test-user", "abc123", "https", false)
          +	require.NoError(t, err)
          +
          +	reg := &httpmock.Registry{}
          +	var gotScopes []string
          +	opts := &RefreshOptions{
          +		Hostname: "github.com",
          +		Config: func() (gh.Config, error) {
          +			return cfg, nil
          +		},
          +		PlainHttpClient: func() (*http.Client, error) {
          +			reg.Register(
          +				httpmock.REST("GET", ""),
          +				func(req *http.Request) (*http.Response, error) {
          +					return &http.Response{
          +						Request:    req,
          +						StatusCode: http.StatusOK,
          +						Body:       io.NopCloser(strings.NewReader("")),
          +						Header: http.Header{
          +							"X-Oauth-Scopes": {oldScopes},
          +						},
          +					}, nil
          +				},
          +			)
          +			return &http.Client{Transport: reg}, nil
          +		},
          +		AuthFlow: func(_ *http.Client, _ *iostreams.IOStreams, _ string, scopes []string, _ bool, _ bool) (token, username, error) {
          +			gotScopes = append([]string{}, scopes...)
          +			return token("xyz456"), username("test-user"), nil
          +		},
          +	}
          +	ios, _, _, _ := iostreams.Test()
          +	ios.SetStdinTTY(false)
          +	ios.SetStdoutTTY(false)
          +	opts.IO = ios
          +	if mutate != nil {
          +		mutate(opts)
          +	}
          +	return opts, &gotScopes, reg
          +}
          +
          +func TestHiddenRefreshNormalizesAndDeduplicatesScopesBeforeAuthFlow(t *testing.T) {
          +	opts, gotScopes, reg := hiddenRefreshOptions(
          +		t,
          +		" repo, Read:Org, gist, Codespace, Project ",
          +		func(opts *RefreshOptions) {
          +			opts.Scopes = []string{"read:org", "WORKFLOW", "workflow", " codespace "}
          +		},
          +	)
          +	defer reg.Verify(t)
          +
          +	require.NoError(t, refreshRun(opts))
          +
          +	assert.Equal(t, []string{"codespace", "project", "workflow"}, *gotScopes)
          +}
          +
          +func TestHiddenRefreshRemovesScopesCaseInsensitively(t *testing.T) {
          +	opts, gotScopes, reg := hiddenRefreshOptions(
          +		t,
          +		"repo,read:org,workflow,codespace,project",
          +		func(opts *RefreshOptions) {
          +			opts.RemoveScopes = []string{"WORKFLOW", "Codespace"}
          +		},
          +	)
          +	defer reg.Verify(t)
          +
          +	require.NoError(t, refreshRun(opts))
          +
          +	assert.Equal(t, []string{"project"}, *gotScopes)
          +}
        command: go
        args:
          - test
          - ./pkg/cmd/auth/refresh
          - -count=1
        timeoutMs: 300000

  - id: gh-cli-pr-checkout-ref-validation-v3
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace: *github_cli_workspace
    phaseA:
      promptId: gh-cli-pr-checkout-ref-validation-v3-formation
      prompt: >-
        We will implement a branch-ref safety follow-up for `gh pr checkout`
        in a later session. Inspect `pkg/cmd/pr/checkout`, PR `headRefName`
        handling, `--branch` handling, existing-remote and missing-remote
        command construction, branch config writes, submodule follow-up
        commands, and package tests. Produce a durable implementation plan
        only; do not edit files. The plan should resolve how to validate
        API-returned head refs and user-supplied local branch names before git
        side effects while preserving valid slash-containing branch names and
        detached checkout behavior.
    phaseB:
      promptId: gh-cli-pr-checkout-ref-validation-v3-use
      prompt: Implement the `gh pr checkout` branch-ref safety follow-up exactly as planned in the prior investigation.
    expectedContext:
      description: >-
        `gh pr checkout` should validate API-returned head refs and
        user-supplied local branch names before building fetch refspecs,
        checkout commands, or branch config keys, while preserving valid
        slash-containing branch names and detach mode.
      keywords:
        - pr checkout
        - headRefName
        - branch
        - refspec
        - config
    seededContext:
      renderedContext: |
        - [memory] gh-cli/pr-checkout-ref-validation: `gh pr checkout` builds git fetch refspecs, checkout targets, reset/merge refs, and `branch.<name>.*` config keys from PR `headRefName` and `--branch`. Validate every branch name before it is interpolated into git arguments or config keys. Reject leading dash, colon, `..`, `@{`, trailing slash or dot, `.lock`, empty/control-character forms, and other malformed ref names. Keep valid slash-containing names such as `feature/slash` and `local/topic/slash`, and preserve `--detach` behavior where no local branch is created.
      contextIds:
