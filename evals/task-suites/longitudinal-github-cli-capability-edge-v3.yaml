        - redaction
        - token
        - client_secret
        - Authorization
    seededContext:
      renderedContext: |
        - [memory] gh-cli/api-verbose-secret-redaction: `gh api --verbose` logging is composed around the API HTTP client. Keep auth header injection and the real request body unchanged, but redact JSON fields named `token`, `access_token`, `client_secret`, or `password` in the verbose logging copy. Non-secret JSON fields should remain visible so verbose output is still useful.
      contextIds:
        - gh-cli/api-verbose-secret-redaction
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/api/http_client_hidden_test.go b/api/http_client_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/api/http_client_hidden_test.go
          @@ -0,0 +1,65 @@
          +package api
          +
          +import (
          +	"fmt"
          +	"io"
          +	"net/http"
          +	"net/http/httptest"
          +	"strings"
          +	"testing"
          +
          +	"github.com/cli/cli/v2/pkg/iostreams"
          +	"github.com/stretchr/testify/assert"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +func TestHiddenHTTPClientVerboseRedactsSecretJSONBodies(t *testing.T) {
          +	var gotAuthorization string
          +	var gotRequestBody string
          +	ts := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          +		gotAuthorization = r.Header.Get(authorization)
          +		body, err := io.ReadAll(r.Body)
          +		require.NoError(t, err)
          +		gotRequestBody = string(body)
          +		w.Header().Set("Content-Type", "application/json; charset=utf-8")
          +		fmt.Fprint(w, `{"access_token":"gho_RESPONSESECRET","safe":"visible"}`)
          +	}))
          +	defer ts.Close()
          +
          +	host := strings.TrimPrefix(ts.URL, "http://")
          +	ios, _, _, stderr := iostreams.Test()
          +	client, err := NewHTTPClient(HTTPClientOptions{
          +		AppVersion:     "v1.2.3",
          +		Config:         tinyConfig{host + ":oauth_token": "AUTH_TOKEN"},
          +		Log:            ios.ErrOut,
          +		LogVerboseHTTP: true,
          +	})
          +	require.NoError(t, err)
          +
          +	requestJSON := `{"token":"ghp_REQUESTSECRET","client_secret":"CLIENTSECRET","safe":"visible"}`
          +	req, err := http.NewRequest("POST", ts.URL, strings.NewReader(requestJSON))
          +	require.NoError(t, err)
          +	req.Header.Set("Content-Type", "application/json; charset=utf-8")
          +	req.Host = host
          +
          +	res, err := client.Do(req)
          +	require.NoError(t, err)
          +	defer res.Body.Close()
          +	body, err := io.ReadAll(res.Body)
          +	require.NoError(t, err)
          +
          +	assert.Equal(t, "token AUTH_TOKEN", gotAuthorization)
          +	assert.Equal(t, requestJSON, gotRequestBody)
          +	assert.Contains(t, string(body), "gho_RESPONSESECRET")
          +
          +	log := stderr.String()
          +	assert.NotContains(t, log, "AUTH_TOKEN")
          +	assert.NotContains(t, log, "ghp_REQUESTSECRET")
          +	assert.NotContains(t, log, "CLIENTSECRET")
          +	assert.NotContains(t, log, "gho_RESPONSESECRET")
          +	assert.Contains(t, log, "Authorization: token")
          +	assert.Contains(t, log, "token")
          +	assert.Contains(t, log, "client_secret")
          +	assert.Contains(t, log, "access_token")
          +	assert.Contains(t, log, "visible")
          +}
        command: go
        args:
          - test
          - ./api
          - -count=1
        timeoutMs: 300000
