          +	"github.com/stretchr/testify/assert"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +func hiddenDevelopOptions(reg *httpmock.Registry) *DevelopOptions {
          +	ios, _, _, _ := iostreams.Test()
          +	return &DevelopOptions{
          +		IssueNumber: 123,
          +		IO:          ios,
          +		GitClient: &git.Client{
          +			GhPath:  "some/path/gh",
          +			GitPath: "some/path/git",
          +		},
          +		HttpClient: func() (*http.Client, error) {
          +			return &http.Client{Transport: reg}, nil
          +		},
          +		BaseRepo: func() (ghrepo.Interface, error) {
          +			return ghrepo.New("OWNER", "REPO"), nil
          +		},
          +		Remotes: func() (context.Remotes, error) {
          +			return context.Remotes{
          +				&context.Remote{
          +					Remote: &git.Remote{Name: "origin"},
          +					Repo:   ghrepo.New("OWNER", "REPO"),
          +				},
          +			}, nil
          +		},
          +	}
          +}
          +
          +func hiddenStubIssueAndFeature(reg *httpmock.Registry) {
          +	reg.Register(
          +		httpmock.GraphQL(`query IssueByNumber\b`),
          +		httpmock.StringResponse(`{"data":{"repository":{"hasIssuesEnabled":true,"issue":{"id":"SOMEID","number":123,"title":"my issue"}}}}`),
          +	)
          +	reg.Register(
          +		httpmock.GraphQL(`query LinkedBranchFeature\b`),
          +		httpmock.StringResponse(`{"data":{"LinkedBranch":{"fields":[{"name":"id"},{"name":"ref"}]}}}`),
          +	)
          +}
          +
          +func TestHiddenDevelopRejectsInvalidRequestedNameBeforeCreateMutation(t *testing.T) {
          +	reg := &httpmock.Registry{}
          +	hiddenStubIssueAndFeature(reg)
          +	reg.Register(
          +		httpmock.GraphQL(`query ListLinkedBranches\b`),
          +		httpmock.StringResponse(`{"data":{"repository":{"issue":{"linkedBranches":{"nodes":[]}}}}}`),
          +	)
          +	reg.Register(
          +		httpmock.GraphQL(`query FindRepoBranchID\b`),
          +		httpmock.StringResponse(`{"data":{"repository":{"id":"REPOID","defaultBranchRef":{"target":{"oid":"DEFAULTOID"}},"ref":{"target":{"oid":""}}}}}`),
          +	)
          +	createMutationCalled := false
          +	reg.Register(
          +		httpmock.GraphQL(`mutation CreateLinkedBranch\b`),
          +		httpmock.GraphQLMutation(`{"data":{"createLinkedBranch":{"linkedBranch":{"id":"2","ref":{"name":"bad:name"}}}}}`, func(map[string]interface{}) {
          +			createMutationCalled = true
          +		}),
          +	)
          +	_, teardown := run.Stub()
          +	defer teardown(t)
          +
          +	opts := hiddenDevelopOptions(reg)
          +	opts.Name = "bad:name"
          +	err := developRun(opts)
          +
          +	require.Error(t, err)
          +	assert.Contains(t, err.Error(), "bad:name")
          +	assert.Contains(t, err.Error(), "branch")
          +	assert.False(t, createMutationCalled)
          +}
          +
          +func TestHiddenDevelopRejectsInvalidCreatedBranchBeforeGitSideEffects(t *testing.T) {
          +	reg := &httpmock.Registry{}
          +	hiddenStubIssueAndFeature(reg)
          +	reg.Register(
          +		httpmock.GraphQL(`query ListLinkedBranches\b`),
          +		httpmock.StringResponse(`{"data":{"repository":{"issue":{"linkedBranches":{"nodes":[]}}}}}`),
          +	)
          +	reg.Register(
          +		httpmock.GraphQL(`query FindRepoBranchID\b`),
          +		httpmock.StringResponse(`{"data":{"repository":{"id":"REPOID","defaultBranchRef":{"target":{"oid":"DEFAULTOID"}},"ref":{"target":{"oid":""}}}}}`),
          +	)
          +	reg.Register(
          +		httpmock.GraphQL(`mutation CreateLinkedBranch\b`),
          +		httpmock.StringResponse(`{"data":{"createLinkedBranch":{"linkedBranch":{"id":"2","ref":{"name":"bad:name"}}}}}`),
          +	)
          +	_, teardown := run.Stub()
          +	defer teardown(t)
          +
          +	opts := hiddenDevelopOptions(reg)
          +	opts.Name = "feature"
          +	err := developRun(opts)
          +
          +	require.Error(t, err)
          +	assert.Contains(t, err.Error(), "bad:name")
          +	assert.Contains(t, err.Error(), "branch")
          +}
          +
          +func TestHiddenDevelopRejectsInvalidBaseBeforeBranchLookup(t *testing.T) {
          +	reg := &httpmock.Registry{}
          +	hiddenStubIssueAndFeature(reg)
          +	branchLookupCalled := false
          +	reg.Register(
          +		httpmock.GraphQL(`query FindRepoBranchID\b`),
          +		httpmock.GraphQLQuery(`{"data":{"repository":{"id":"REPOID","ref":{"target":{"oid":"OID"}}}}}`, func(_ string, _ map[string]interface{}) {
          +			branchLookupCalled = true
