  - id: django-exclude-multivalued-relation-v1
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace:
      kind: git
      repo: django/django
      sha: 5b3109329936e37432b1795f4b355ed60c4efd0a
    phaseA:
      promptId: django-exclude-multivalued-relation-v1-formation
      prompt: >-
        We will add a Django ORM filtering helper in a later session. This codebase relates an author to their books (one-to-many), and each book has a genre and a year. Investigate how Django negates several conditions over a multi-valued relation: build the models in a throwaway script with `settings.configure()` and `schema_editor`, seed an author whose books each satisfy only ONE of two conditions (no single book satisfies both) alongside an author with a single book that satisfies both, then run `exclude(books__genre=.., books__year__lt=..)` and observe which authors survive. Compare against negating the equivalent `filter` via a subquery, and inspect the SQL the `exclude` generates. Produce a durable implementation plan only; do not edit files.
    phaseB:
      promptId: django-exclude-multivalued-relation-v1-use
      prompt: |
        Implement a module `lore_solution.py` at the repository root with a function `authors_without_matching_book(Author, genre, max_year)` over an `Author` model that has a reverse one-to-many `books` relation (each `Book` has `genre` and `year`).

        Return the authors who have NO single book that is BOTH in `genre` AND published before `max_year`. An author whose books each satisfy only one of the two conditions — but where no single book satisfies both — must be INCLUDED in the result. Return a list of `Author` instances. Do not edit files outside `lore_solution.py`.
    expectedContext:
      description: >-
        A multi-kwarg `exclude(rel__a, rel__b)` over a multi-valued relation does not mean "exclude parents with a single related row matching both"; it pushes the conditions into the negation separately, so the correct "no single related row matches both" requires excluding a subquery/`Exists` of the equivalent positive filter.
      keywords:
        - "exclude"
        - "multi-valued"
        - "subquery"
        - "Exists"
        - "negation"
    seededContext:
      renderedContext: |
        - [memory] django/exclude-multivalued-relation: `qs.exclude(rel__a=x, rel__b=y)` over a multi-valued relation does NOT mean "exclude parents that have a single related row matching both conditions". Django pushes each condition into the NOT logic separately, so it behaves differently from negating the equivalent `filter` and silently drops parents it should keep. To express "no single related row matches both conditions", exclude a subquery of the positive filter: `exclude(pk__in=Model.objects.filter(rel__a=x, rel__b=y))` (or a single nested `Q`/`Exists`). The naive multi-kwarg `exclude` reads identically to the `filter` form but is wrong on multi-valued relations.
      contextIds:
        - django/exclude-multivalued-relation
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/lore_eval_hidden_django_exclude_multivalued.py b/lore_eval_hidden_django_exclude_multivalued.py
          new file mode 100644
          index 0000000..da6123c
          --- /dev/null
          +++ b/lore_eval_hidden_django_exclude_multivalued.py
          @@ -0,0 +1,81 @@
          +import django
          +from django.conf import settings
          +
