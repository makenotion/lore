version: 1
runner: task
longitudinal: true
name: lore-longitudinal-django-modelhard-v1
description: >-
  Model-hard Django ORM longitudinal suite. Scenarios pin a stable Django
  revision and ask the agent to implement a small reporting or persistence
  module against an intrinsic Django ORM / ModelForm contract whose correct use
  is counterintuitive to a strong model reasoning from defaults. Each rule is
  discoverable by constructing models and observing query results (row counts,
  SQL joins, persisted side effects), but easy to violate under time pressure in
  a way that returns silently wrong data rather than raising. Verified through
  deterministic in-process tests on an in-memory SQLite database with no DB
  server or network.
seededCorpus: ../vault-seeds/django-modelhard-v1.yaml
conditions:
  - no-memory
  - seeded-lore
  - lore-full-loop
scenarios:
  - id: django-filter-chained-vs-single-multivalued-v1
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace:
      kind: git
      repo: django/django
      sha: 5b3109329936e37432b1795f4b355ed60c4efd0a
    phaseA:
      promptId: django-filter-chained-vs-single-multivalued-v1-formation
      prompt: >-
        We will add a small Django ORM reporting module in a later session. This codebase models blogs and their entries as a one-to-many relation. Investigate how Django spans a multi-valued relation when you put several conditions in a lookup: construct a couple of models in a throwaway script with `settings.configure()` and `schema_editor`, seed a blog whose conditions are spread across DIFFERENT related rows versus a blog where one row satisfies everything, and run queries both as a single `filter(rel__a=.., rel__b=..)` and as chained `.filter(rel__a=..).filter(rel__b=..)`. Observe the returned primary rows and their multiplicity (count duplicates), and inspect the generated SQL joins. Produce a durable implementation plan only; do not edit files.
    phaseB:
      promptId: django-filter-chained-vs-single-multivalued-v1-use
      prompt: |
        Implement a module `lore_solution.py` at the repository root with two query helpers over a `Blog` model that has a reverse one-to-many `entries` relation (each `Entry` has `pub_year` and `headline`).

        `blogs_with_year_and_keyword_same_entry(Blog, year, keyword)`: return the blogs that have a single entry which is BOTH from `year` AND whose headline contains `keyword`.

        `blogs_with_year_and_keyword_any_entries(Blog, year, keyword)`: return the blogs that have an entry from `year` AND (possibly a different) entry whose headline contains `keyword`. No blog may appear more than once in the result.

        Both return lists of `Blog` instances. Do not edit files outside `lore_solution.py`.
    expectedContext:
      description: >-
        Across a multi-valued relation, one `filter(rel__a, rel__b)` requires a single related row to satisfy both conditions, whereas chained `.filter().filter()` allows different related rows per condition and joins repeatedly, which can return duplicate primary rows unless de-duplicated.
      keywords:
        - "filter"
        - "chained"
        - "multi-valued"
        - "distinct"
        - "spanning relationships"
    seededContext:
      renderedContext: |
        - [memory] django/multivalued-filter-chaining: Spanning a multi-valued relation in Django, one `.filter(rel__a=x, rel__b=y)` (both lookups in a single filter) requires the SAME related row to satisfy both conditions, while chaining `.filter(rel__a=x).filter(rel__b=y)` allows DIFFERENT related rows to satisfy each and performs multiple joins that can return DUPLICATE primary rows — add `.distinct()`. Choose the single-filter form when both conditions must hold on the same related row; choose chained filters (with `.distinct()`) when they may hold on different related rows. The two forms read identically in intent but are NOT interchangeable.
      contextIds:
        - django/multivalued-filter-chaining
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/lore_eval_hidden_django_multivalued_filter.py b/lore_eval_hidden_django_multivalued_filter.py
          new file mode 100644
          index 0000000..21e4310
          --- /dev/null
          +++ b/lore_eval_hidden_django_multivalued_filter.py
          @@ -0,0 +1,88 @@
          +import django
          +from django.conf import settings
          +
          +if not settings.configured:
          +    settings.configure(
          +        DEBUG=False,
          +        DATABASES={"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}},
          +        INSTALLED_APPS=[
          +            "django.contrib.contenttypes",
          +            "django.contrib.auth",
          +            "lore_eval_hidden_django_multivalued_filter",
          +        ],
          +        USE_TZ=True,
          +        DEFAULT_AUTO_FIELD="django.db.models.BigAutoField",
          +    )
          +    django.setup()
          +
          +from collections import Counter
          +
          +import pytest
          +from django.db import connection, models
          +
          +from lore_solution import (
          +    blogs_with_year_and_keyword_any_entries,
          +    blogs_with_year_and_keyword_same_entry,
          +)
          +
          +
          +class Blog(models.Model):
          +    name = models.CharField(max_length=100)
          +
          +
          +class Entry(models.Model):
          +    blog = models.ForeignKey(Blog, on_delete=models.CASCADE, related_name="entries")
          +    headline = models.CharField(max_length=200)
          +    pub_year = models.IntegerField()
          +
          +
          +@pytest.fixture(autouse=True)
          +def _schema():
          +    with connection.schema_editor() as se:
          +        se.create_model(Blog)
          +        se.create_model(Entry)
          +    yield
          +    with connection.schema_editor() as se:
          +        se.delete_model(Entry)
          +        se.delete_model(Blog)
          +
          +
          +def _seed():
          +    cross = Blog.objects.create(name="cross")
          +    Entry.objects.create(blog=cross, headline="release notes 1991", pub_year=1991)
          +    Entry.objects.create(blog=cross, headline="a note on McCartney", pub_year=2014)
          +    Entry.objects.create(blog=cross, headline="filler from 1991", pub_year=1991)
          +
          +    same = Blog.objects.create(name="same")
          +    Entry.objects.create(blog=same, headline="McCartney recap of 1991", pub_year=1991)
          +
          +    neither = Blog.objects.create(name="neither")
          +    Entry.objects.create(blog=neither, headline="unrelated", pub_year=2000)
          +    return cross, same, neither
          +
          +
          +def test_same_entry_requires_one_row_to_match_both():
          +    _seed()
          +    names = sorted(b.name for b in blogs_with_year_and_keyword_same_entry(Blog, 1991, "McCartney"))
          +    assert names == ["same"]
          +
          +
          +def test_any_entries_allows_different_rows_per_condition():
          +    _seed()
          +    names = sorted(b.name for b in blogs_with_year_and_keyword_any_entries(Blog, 1991, "McCartney"))
          +    assert names == ["cross", "same"]
          +
          +
          +def test_any_entries_does_not_return_duplicate_blogs():
          +    _seed()
          +    results = blogs_with_year_and_keyword_any_entries(Blog, 1991, "McCartney")
          +    pks = [b.pk for b in results]
          +    counts = Counter(pks)
          +    assert all(c == 1 for c in counts.values()), counts
          +
          +
          +def test_same_entry_is_strict_subset_of_any_entries():
          +    _seed()
          +    same = {b.pk for b in blogs_with_year_and_keyword_same_entry(Blog, 1991, "McCartney")}
          +    anyq = {b.pk for b in blogs_with_year_and_keyword_any_entries(Blog, 1991, "McCartney")}
          +    assert same < anyq
        command: uv
        args:
          - run
          - --no-project
          - --with-editable
          - .
          - --with
          - pytest==7.4.4
          - python
          - -m
          - pytest
          - lore_eval_hidden_django_multivalued_filter.py
          - -q
        timeoutMs: 300000

  - id: django-annotate-multi-aggregate-fanout-v1
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace:
      kind: git
      repo: django/django
      sha: 5b3109329936e37432b1795f4b355ed60c4efd0a
    phaseA:
      promptId: django-annotate-multi-aggregate-fanout-v1-formation
      prompt: >-
        We will add a Django ORM reporting helper in a later session. This codebase relates a book to its authors and to the stores carrying it through two independent multi-valued relations. Investigate what happens when you compute two aggregates over two different multi-valued relations in one `annotate()` call: build the models in a throwaway script with `settings.configure()` and `schema_editor`, seed a book with, say, two authors and three stores, then `annotate(Count("authors"), Count("stores"))` and read each annotated value. Compare against running each `Count` alone, and inspect the SQL to see how the joins compose. Produce a durable implementation plan only; do not edit files.
    phaseB:
      promptId: django-annotate-multi-aggregate-fanout-v1-use
      prompt: |
        Implement a module `lore_solution.py` at the repository root with a single function `book_counts(Book)` over a `Book` model that has two many-to-many relations: `authors` and `stores`.

        Return a dict mapping each book's primary key to `{"authors": n, "stores": m}` where `n` is the number of distinct authors of the book and `m` is the number of distinct stores carrying it. Every book must report its true author and store counts. Do not edit files outside `lore_solution.py`.
    expectedContext:
      description: >-
        Two aggregates over two different multi-valued relations in one `annotate()` are computed by JOINs, so the counts multiply each other; for `Count`, each needs `distinct=True`, otherwise a book with 2 authors and 3 stores reports 6 and 6.
      keywords:
        - "annotate"
        - "Count"
        - "distinct"
        - "join fanout"
        - "multiple aggregations"
    seededContext:
      renderedContext: |
        - [memory] django/multi-aggregate-join-fanout: Two `Count()` (or any two aggregate) annotations over DIFFERENT multi-valued relations in a single `annotate()` call are computed by JOINs, so the counts MULTIPLY — a book with 2 authors and 3 stores reports 6 and 6, not 2 and 3. For `Count`, pass `distinct=True` to each annotation. For non-`Count` aggregates there is no kwarg fix — compute each via a separate `Subquery`/`OuterRef` annotation. Never combine multiple multi-valued aggregates in one annotate without distinct or subqueries.
      contextIds:
        - django/multi-aggregate-join-fanout
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/lore_eval_hidden_django_multi_aggregate.py b/lore_eval_hidden_django_multi_aggregate.py
          new file mode 100644
          index 0000000..eb80d2c
          --- /dev/null
          +++ b/lore_eval_hidden_django_multi_aggregate.py
          @@ -0,0 +1,84 @@
          +import django
          +from django.conf import settings
          +
          +if not settings.configured:
          +    settings.configure(
          +        DEBUG=False,
          +        DATABASES={"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}},
          +        INSTALLED_APPS=[
          +            "django.contrib.contenttypes",
          +            "django.contrib.auth",
          +            "lore_eval_hidden_django_multi_aggregate",
          +        ],
          +        USE_TZ=True,
          +        DEFAULT_AUTO_FIELD="django.db.models.BigAutoField",
          +    )
          +    django.setup()
          +
          +import pytest
          +from django.db import connection, models
          +
          +from lore_solution import book_counts
          +
          +
          +class Author(models.Model):
          +    name = models.CharField(max_length=100)
          +
          +
          +class Store(models.Model):
          +    name = models.CharField(max_length=100)
          +
          +
          +class Book(models.Model):
          +    title = models.CharField(max_length=100)
          +    authors = models.ManyToManyField(Author, related_name="books")
          +    stores = models.ManyToManyField(Store, related_name="books")
          +
          +
          +@pytest.fixture(autouse=True)
          +def _schema():
          +    with connection.schema_editor() as se:
          +        se.create_model(Author)
          +        se.create_model(Store)
          +        se.create_model(Book)
          +    yield
          +    with connection.schema_editor() as se:
          +        se.delete_model(Book)
          +        se.delete_model(Store)
          +        se.delete_model(Author)
          +
          +
          +def _seed():
          +    novel = Book.objects.create(title="novel")
          +    authors = [Author.objects.create(name=f"a{i}") for i in range(3)]
          +    stores = [Store.objects.create(name=f"s{i}") for i in range(4)]
          +    novel.authors.add(*authors)
          +    novel.stores.add(*stores)
          +
          +    solo = Book.objects.create(title="solo")
          +    solo.authors.add(authors[0])
          +    solo.stores.add(stores[0])
          +    return novel, solo
          +
          +
          +def test_each_count_reflects_its_own_relation():
          +    novel, solo = _seed()
          +    result = book_counts(Book)
          +    assert result[novel.pk] == {"authors": 3, "stores": 4}
          +    assert result[solo.pk] == {"authors": 1, "stores": 1}
          +
          +
          +def test_counts_do_not_multiply_across_relations():
          +    novel, _ = _seed()
          +    result = book_counts(Book)
          +    # The join-fanout bug reports authors*stores for both counts.
          +    assert result[novel.pk]["authors"] != result[novel.pk]["stores"]
          +    assert result[novel.pk]["authors"] == 3
          +    assert result[novel.pk]["stores"] == 4
          +
          +
          +def test_handles_book_with_no_related_rows():
          +    Book.objects.create(title="empty")
          +    result = book_counts(Book)
          +    empty = Book.objects.get(title="empty")
          +    assert result[empty.pk] == {"authors": 0, "stores": 0}
        command: uv
        args:
          - run
          - --no-project
          - --with-editable
          - .
          - --with
          - pytest==7.4.4
          - python
          - -m
          - pytest
          - lore_eval_hidden_django_multi_aggregate.py
          - -q
        timeoutMs: 300000

  - id: django-annotate-filter-noncommutative-v1
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace:
      kind: git
      repo: django/django
      sha: 5b3109329936e37432b1795f4b355ed60c4efd0a
    phaseA:
      promptId: django-annotate-filter-noncommutative-v1-formation
      prompt: >-
        We will add a Django ORM reporting helper in a later session. This codebase relates a publisher to its books (reverse one-to-many) and each book carries a rating. Investigate whether the order of `annotate()` and `filter()` changes the per-row aggregate value: build the models in a throwaway script with `settings.configure()` and `schema_editor`, seed two publishers with mixed ratings, then run `annotate(n=Count("books")).filter(books__rating__gt=3)` and `filter(books__rating__gt=3).annotate(n=Count("books"))` and compare the `n` each publisher reports. Inspect the SQL to see which rows the aggregate sees in each ordering. Produce a durable implementation plan only; do not edit files.
    phaseB:
      promptId: django-annotate-filter-noncommutative-v1-use
      prompt: |
        Implement a module `lore_solution.py` at the repository root with two helpers over a `Publisher` model that has a reverse one-to-many `books` relation (each `Book` has a `rating`).

        `total_books_per_publisher(Publisher, min_rating)`: for every publisher that has at least one book rated strictly greater than `min_rating`, return its TOTAL book count regardless of rating.

        `highly_rated_books_per_publisher(Publisher, min_rating)`: for every publisher, return the count of ONLY the books rated strictly greater than `min_rating`.

        Both return dicts mapping publisher name to a count. Do not edit files outside `lore_solution.py`.
    expectedContext:
      description: >-
        `annotate()` and `filter()` are not commutative: annotate-then-filter counts all related rows and only uses the filter to select which parents appear, while filter-then-annotate constrains the rows the aggregate sees; the annotate-first form also needs `distinct=True` to avoid join fanout.
      keywords:
        - "annotate"
        - "filter"
        - "order"
        - "non-commutative"
        - "aggregation"
    seededContext:
      renderedContext: |
        - [memory] django/annotate-filter-order: `annotate()` and `filter()` are NOT commutative. `annotate(n=Count('book')).filter(book__rating__gt=3)` counts ALL books (the annotation is computed before the filter) and only uses the filter to pick which parent rows appear. `filter(book__rating__gt=3).annotate(n=Count('book'))` counts only the books matching the filter (the filter constrains the rows fed to the aggregate). Put the filter BEFORE the annotate when the aggregate should see only matching rows; put it AFTER when it should see all rows. The annotate-first form still needs `distinct=True` to avoid join fanout.
      contextIds:
        - django/annotate-filter-order
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/lore_eval_hidden_django_annotate_filter_order.py b/lore_eval_hidden_django_annotate_filter_order.py
          new file mode 100644
          index 0000000..0acf2c7
          --- /dev/null
          +++ b/lore_eval_hidden_django_annotate_filter_order.py
          @@ -0,0 +1,81 @@
          +import django
          +from django.conf import settings
          +
          +if not settings.configured:
          +    settings.configure(
          +        DEBUG=False,
          +        DATABASES={"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}},
          +        INSTALLED_APPS=[
          +            "django.contrib.contenttypes",
          +            "django.contrib.auth",
          +            "lore_eval_hidden_django_annotate_filter_order",
          +        ],
          +        USE_TZ=True,
          +        DEFAULT_AUTO_FIELD="django.db.models.BigAutoField",
          +    )
          +    django.setup()
          +
          +import pytest
          +from django.db import connection, models
          +
          +from lore_solution import (
          +    highly_rated_books_per_publisher,
          +    total_books_per_publisher,
          +)
          +
          +
          +class Publisher(models.Model):
          +    name = models.CharField(max_length=100)
          +
          +
          +class Book(models.Model):
          +    title = models.CharField(max_length=100)
          +    rating = models.FloatField()
          +    publisher = models.ForeignKey(
          +        Publisher, on_delete=models.CASCADE, related_name="books"
          +    )
          +
          +
          +@pytest.fixture(autouse=True)
          +def _schema():
          +    with connection.schema_editor() as se:
          +        se.create_model(Publisher)
          +        se.create_model(Book)
          +    yield
          +    with connection.schema_editor() as se:
