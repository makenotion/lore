          +    _seed()
          +    names = {a.name for a in authors_without_matching_book(Author, "sci-fi", 2000)}
          +    assert "flagged" not in names
          +
          +
          +def test_exact_result_set():
          +    _seed()
          +    names = sorted(a.name for a in authors_without_matching_book(Author, "sci-fi", 2000))
          +    assert names == ["clean", "empty", "straddle"]
