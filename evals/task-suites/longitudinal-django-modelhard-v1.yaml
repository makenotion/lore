          +    # both sci-fi AND pre-2000, so this author must be INCLUDED in the result.
          +    straddle = Author.objects.create(name="straddle")
          +    Book.objects.create(author=straddle, genre="sci-fi", year=2012)
          +    Book.objects.create(author=straddle, genre="fantasy", year=1994)
          +
          +    # A single book is both sci-fi AND pre-2000 -> EXCLUDED.
          +    flagged = Author.objects.create(name="flagged")
          +    Book.objects.create(author=flagged, genre="sci-fi", year=1995)
          +    Book.objects.create(author=flagged, genre="history", year=2018)
          +
          +    # No qualifying genre at all -> INCLUDED.
          +    clean = Author.objects.create(name="clean")
          +    Book.objects.create(author=clean, genre="memoir", year=1980)
          +
          +    # No books -> INCLUDED.
          +    Author.objects.create(name="empty")
          +    return straddle, flagged, clean
          +
          +
          +def test_author_with_split_conditions_is_kept():
          +    _seed()
          +    names = {a.name for a in authors_without_matching_book(Author, "sci-fi", 2000)}
