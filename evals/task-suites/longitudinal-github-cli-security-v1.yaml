    expectedContext:
      description: "Each archive entry's resolved target must be validated to stay inside the destination directory before any file is written, rejecting `../` and absolute entry names with an illegal-path error, while benign entries extract normally."
      keywords:
        - copilot
        - archive
        - extract
        - traversal
        - zip-slip
    seededContext:
      renderedContext: "- [memory] gh-cli/copilot-archive-zip-slip: When extracting a downloaded archive (`extractTarGz`/`extractZip` in `pkg/cmd/copilot/copilot.go`), never write an entry without validating its path. Resolve `target := filepath.Join(destDir, entryName)` and require that the cleaned target stays within `destDir` (e.g. a HasPrefix check, or the shared safepaths helper); reject with an illegal-file-path error otherwise. This blocks Zip Slip / path traversal from `../` or absolute entry names in a malicious archive."
      contextIds:
        - gh-cli/copilot-archive-zip-slip
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/pkg/cmd/copilot/hidden_zipslip_test.go b/pkg/cmd/copilot/hidden_zipslip_test.go
          new file mode 100644
          index 0000000..1111111
          --- /dev/null
          +++ b/pkg/cmd/copilot/hidden_zipslip_test.go
          @@ -0,0 +1,137 @@
          +package copilot
          +
          +import (
          +	"archive/tar"
          +	"archive/zip"
          +	"bytes"
          +	"compress/gzip"
          +	"os"
          +	"path/filepath"
          +	"testing"
          +)
          +
          +type hiddenArchiveEntry struct {
          +	name string
          +	body string
          +}
          +
          +func hiddenBuildTarGz(t *testing.T, entries []hiddenArchiveEntry) []byte {
          +	t.Helper()
          +	var buf bytes.Buffer
          +	gz := gzip.NewWriter(&buf)
          +	tw := tar.NewWriter(gz)
          +	for _, e := range entries {
          +		hdr := &tar.Header{
          +			Name:     e.name,
          +			Mode:     0o644,
          +			Size:     int64(len(e.body)),
          +			Typeflag: tar.TypeReg,
          +		}
          +		if err := tw.WriteHeader(hdr); err != nil {
          +			t.Fatalf("write tar header %q: %v", e.name, err)
          +		}
          +		if _, err := tw.Write([]byte(e.body)); err != nil {
          +			t.Fatalf("write tar body %q: %v", e.name, err)
          +		}
          +	}
          +	if err := tw.Close(); err != nil {
          +		t.Fatalf("close tar: %v", err)
          +	}
          +	if err := gz.Close(); err != nil {
          +		t.Fatalf("close gzip: %v", err)
          +	}
          +	return buf.Bytes()
          +}
          +
          +func hiddenBuildZip(t *testing.T, entries []hiddenArchiveEntry) []byte {
          +	t.Helper()
          +	var buf bytes.Buffer
          +	zw := zip.NewWriter(&buf)
          +	for _, e := range entries {
          +		w, err := zw.Create(e.name)
          +		if err != nil {
          +			t.Fatalf("create zip entry %q: %v", e.name, err)
          +		}
          +		if _, err := w.Write([]byte(e.body)); err != nil {
          +			t.Fatalf("write zip entry %q: %v", e.name, err)
          +		}
          +	}
          +	if err := zw.Close(); err != nil {
          +		t.Fatalf("close zip: %v", err)
          +	}
          +	return buf.Bytes()
          +}
          +
          +// hiddenEscapeCanary returns an absolute path just outside destDir that a Zip
          +// Slip traversal would write to, plus the relative entry name that targets it.
          +func hiddenEscapeCanary(t *testing.T, destDir string) (entryName, absTarget string) {
          +	t.Helper()
          +	parent := filepath.Dir(destDir)
          +	canary := "hidden-zipslip-canary.txt"
          +	abs := filepath.Join(parent, canary)
          +	// Remove any stale canary so a false negative can't pass.
          +	_ = os.Remove(abs)
          +	// destDir is .../extract; the entry climbs one level into its parent.
          +	return filepath.Join("..", canary), abs
          +}
          +
          +func TestHiddenExtractTarGzRejectsPathTraversal(t *testing.T) {
          +	base := t.TempDir()
          +	dest := filepath.Join(base, "extract")
          +	if err := os.MkdirAll(dest, 0o755); err != nil {
          +		t.Fatal(err)
          +	}
          +	traversalName, canaryAbs := hiddenEscapeCanary(t, dest)
          +
          +	archive := hiddenBuildTarGz(t, []hiddenArchiveEntry{
          +		{name: "sub/safe.txt", body: "ok"},
          +		{name: traversalName, body: "pwned"},
          +	})
          +
          +	err := extractTarGz(bytes.NewReader(archive), dest)
          +	if err == nil {
          +		t.Fatal("expected extractTarGz to reject a path-traversal entry, got nil")
          +	}
          +	if _, statErr := os.Stat(canaryAbs); statErr == nil {
          +		t.Fatalf("traversal entry escaped the destination and wrote %s", canaryAbs)
          +	}
          +}
          +
          +func TestHiddenExtractZipRejectsPathTraversal(t *testing.T) {
          +	base := t.TempDir()
          +	dest := filepath.Join(base, "extract")
          +	if err := os.MkdirAll(dest, 0o755); err != nil {
          +		t.Fatal(err)
          +	}
          +	traversalName, canaryAbs := hiddenEscapeCanary(t, dest)
          +
          +	archive := hiddenBuildZip(t, []hiddenArchiveEntry{
          +		{name: "sub/safe.txt", body: "ok"},
          +		{name: traversalName, body: "pwned"},
          +	})
          +
          +	err := extractZip(bytes.NewReader(archive), dest)
          +	if err == nil {
          +		t.Fatal("expected extractZip to reject a path-traversal entry, got nil")
          +	}
          +	if _, statErr := os.Stat(canaryAbs); statErr == nil {
          +		t.Fatalf("traversal entry escaped the destination and wrote %s", canaryAbs)
          +	}
          +}
          +
          +func TestHiddenExtractTarGzAcceptsBenignArchive(t *testing.T) {
          +	dest := t.TempDir()
          +	archive := hiddenBuildTarGz(t, []hiddenArchiveEntry{
          +		{name: "nested/dir/file.txt", body: "hello"},
          +	})
          +	if err := extractTarGz(bytes.NewReader(archive), dest); err != nil {
          +		t.Fatalf("expected benign tar.gz to extract, got: %v", err)
          +	}
          +	got, err := os.ReadFile(filepath.Join(dest, "nested", "dir", "file.txt"))
          +	if err != nil {
          +		t.Fatalf("benign entry was not extracted: %v", err)
          +	}
          +	if string(got) != "hello" {
          +		t.Fatalf("unexpected extracted content: %q", string(got))
          +	}
          +}
        command: go
        args:
          - "test"
          - "./pkg/cmd/copilot"
          - "-run"
          - "TestHiddenExtract"
          - "-count=1"
        timeoutMs: 600000
