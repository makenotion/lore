    expectedContext:
      description: >-
        Lock accepts exactly four snake_case reason tokens mapping to GraphQL
        enum members, and an unset reason sends a nil lock reason, never a
        default.
      keywords:
        - issue lock
        - reason
        - snake_case
        - LockReason
        - nil
    seededContext:
      renderedContext: |
        - [memory] gh-cli/lock-reason-enum: `gh issue lock` / `gh pr lock` accept exactly four `--reason` values, all snake_case: `off_topic`, `resolved`, `spam`, `too_heated` (NOT hyphenated, spaced, run-together, or title-cased). They map to GraphQL `LockReason` members `OFF_TOPIC`/`RESOLVED`/`SPAM`/`TOO_HEATED`. An unset or empty reason sends a nil/omitted `lockReason` so the server records no reason; never substitute a default value. Any other reason is rejected before the mutation with a flag error listing the four. Regressions should prove a hyphenated reason is rejected, a snake_case reason maps to the matching enum member, and an unset reason sends nil.
      contextIds:
        - gh-cli/lock-reason-enum
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/.lore-hidden-verify.mjs b/.lore-hidden-verify.mjs
          new file mode 100644
          index 0000000..0000000
          --- /dev/null
          +++ b/.lore-hidden-verify.mjs
          @@ -0,0 +1,24 @@
          +import fs from 'node:fs';
          +import path from 'node:path';
          +const NL = String.fromCharCode(10);
          +function read(p) { return fs.readFileSync(p, 'utf8'); }
          +function assert(cond, msg) { if (!cond) throw new Error(msg); }
          +function filesUnder(dir) {
          +  const out = [];
          +  for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
          +    const p = path.join(dir, ent.name);
          +    if (ent.isDirectory()) out.push(...filesUnder(p));
          +    else out.push(p);
          +  }
          +  return out;
          +}
          +const dir = 'pkg/cmd/issue/lock';
          +const impl = filesUnder(dir).filter(f => f.endsWith('.go') && !f.endsWith('_test.go')).map(read).join(NL);
          +const tests = filesUnder(dir).filter(f => f.endsWith('_test.go')).map(read).join(NL);
          +for (const tok of ['off_topic', 'resolved', 'spam', 'too_heated']) assert(impl.includes(tok), 'accepted reasons are not the snake_case token ' + tok);
          +assert(!/"off-topic"|"too-heated"/.test(impl), 'accepted reasons still use the hyphenated forms');
          +assert(/LockReasonOffTopic|LockReasonTooHeated|LockReason/.test(impl), 'reasons do not map to the GraphQL LockReason enum');
          +assert(/nil/.test(impl), 'an unset reason does not resolve to a nil lock reason');
          +const hasReasonTests = /[Rr]eason/.test(tests) && /(off_topic|too_heated|off-topic|too-heated|OFF_TOPIC|TOO_HEATED|LockReason)/.test(tests);
          +if (hasReasonTests) assert(/off-topic|too-heated|invalid|FlagError/i.test(tests) && /off_topic|too_heated|OFF_TOPIC|TOO_HEATED/.test(tests), 'reason tests do not pin the reject-wrong-casing and accept-snake_case behavior');
        command: bash
        args:
          - -lc
          - node .lore-hidden-verify.mjs && go test ./pkg/cmd/issue/lock -count=1
        timeoutMs: 300000
