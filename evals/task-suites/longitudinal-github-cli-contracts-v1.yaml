version: 1
runner: task
longitudinal: true
name: lore-longitudinal-github-cli-contracts-v1
description: >-
  GitHub CLI command/output-contract longitudinal suite. Phase B asks for a
  concrete behavior whose non-inferable rule (inverted payload field, unset
  GraphQL defaults, exact URL anchors, host-split remotes, a magic exit code,
  snake_case enum tokens) is absent or wrong at the pinned SHA. Memory supplies
  the contract; hidden verifiers gate on the contract tokens and a package
  go test the agent must author.
seededCorpus: ../vault-seeds/github-cli-contracts-v1.yaml
conditions:
  - no-memory
  - seeded-lore
  - lore-full-loop
scenarios:
  - id: gh-cli-repo-deploy-key-add-dry-run-json-readonly-inversion-v1
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace:
      kind: git
      repo: cli/cli
      sha: 9a593ce81b593dee752cc11737d1a3ef768e52b3
    phaseA:
      promptId: gh-cli-repo-deploy-key-add-dry-run-json-readonly-inversion-v1-formation
      prompt: >-
        We will implement a follow-up feature in a later session: a dry-run
        plan mode for adding a repository deploy key. Inspect
        `gh repo deploy-key add`, its upload HTTP path, the keys REST endpoint
        payload, the allow-write flag, stdin/file key input, and the package
        tests. Produce a durable implementation plan only; do not edit files.
        The plan must resolve the exact REST payload field names and their
        relationship to the CLI flags, the JSON plan fields, and tests proving
        no key upload happens during dry-run.
    phaseB:
      promptId: gh-cli-repo-deploy-key-add-dry-run-json-readonly-inversion-v1-use
      prompt: >-
        Add `gh repo deploy-key add <key-file> --dry-run --json` that prints the
        planned keys POST body without calling the endpoint. The plan must carry
        the same payload fields the real upload sends, the dry-run must perform
        no key POST, and normal add behavior must stay unchanged. Add focused
        package regressions covering the planned payload and the no-upload
        boundary.
    expectedContext:
      description: >-
        Deploy-key add dry-run should mirror the real keys POST payload exactly,
        including the inverted read_only field derived from the allow-write
        flag, and must perform no upload.
      keywords:
        - deploy-key
        - dry-run
        - read_only
        - allow-write
        - upload
    seededContext:
      renderedContext: |
        - [memory] gh-cli/deploy-key-add-readonly-inversion: Add `gh repo deploy-key add <key-file> --dry-run --json` that prints the planned `repos/{owner}/{repo}/keys` POST body without calling it. The REST body field is snake_case `read_only` equal to the NEGATION of the `--allow-write` flag (`read_only: !allowWrite`); the default with no `--allow-write` is a read-only key. The field is not `write`, `allow_write`, `readOnly`, nor `read_only` set to the flag value directly. Dry-run emits a JSON plan with `title`, `key`, and the already-inverted `read_only`, and performs no POST. Tests should prove a normal add posts `read_only` true without `--allow-write` and false with it, and that dry-run registers zero key POSTs.
      contextIds:
        - gh-cli/deploy-key-add-readonly-inversion
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/.lore-hidden-verify.mjs b/.lore-hidden-verify.mjs
          new file mode 100644
          index 0000000..0000000
          --- /dev/null
          +++ b/.lore-hidden-verify.mjs
          @@ -0,0 +1,26 @@
          +import fs from 'node:fs';
          +import path from 'node:path';
          +const NL = String.fromCharCode(10);
          +function read(p) { return fs.readFileSync(p, 'utf8'); }
          +function assert(cond, msg) { if (!cond) throw new Error(msg); }
          +function filesUnder(dir) {
          +  const out = [];
          +  for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
          +    const p = path.join(dir, ent.name);
          +    if (ent.isDirectory()) out.push(...filesUnder(p));
          +    else out.push(p);
          +  }
          +  return out;
          +}
          +const dir = 'pkg/cmd/repo/deploy-key/add';
          +const impl = filesUnder(dir).filter(f => f.endsWith('.go') && !f.endsWith('_test.go')).map(read).join(NL);
          +const tests = filesUnder(dir).filter(f => f.endsWith('_test.go')).map(read).join(NL);
          +const all = impl + NL + tests;
          +assert(/dry-run|DryRun/.test(impl), 'deploy-key add lacks a dry-run mode');
          +assert(/Exporter|AddJSON|--json|JSON/.test(impl), 'deploy-key add lacks JSON plan output');
          +assert(/read_only/.test(all), 'plan/payload does not use the snake_case read_only field');
          +assert(/!\s*(opts\.)?(isWritable|allowWrite|AllowWrite|Writable)|read_only["'`:\s]+.*!/.test(impl), 'read_only is not derived from the negation of the allow-write flag');
          +assert(!/"write"|allow_write|readOnly/.test(impl), 'plan/payload uses a wrong field name instead of read_only');
          +assert(/keys/.test(tests) && /(not called|no request|unexpected|Verify|len\(reg|pending mocks|RESTPayload|payload|Register)/i.test(tests), 'tests do not exercise the keys POST boundary');
          +assert(/read_only/.test(tests) && /(true|false)/.test(tests), 'tests do not pin the read_only true/false polarity');
        command: bash
        args:
          - -lc
          - node .lore-hidden-verify.mjs && go test ./pkg/cmd/repo/deploy-key/add -count=1
        timeoutMs: 300000
