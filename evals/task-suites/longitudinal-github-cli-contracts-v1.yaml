      prompt: >-
        Make `gh pr checks` return a distinct process exit code when checks are
        still pending and none have failed, separate from the failed-checks exit
        code. Preserve the existing watch/fail-fast/interval/json flag guards.
        Add focused package regressions that distinguish a pending-only run from
        a failed run, and that pin how the top-level runner maps each sentinel
        error to its process exit code.
    expectedContext:
