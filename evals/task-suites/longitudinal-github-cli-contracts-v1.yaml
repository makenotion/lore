      promptId: gh-cli-browse-line-range-plain-anchor-url-contract-v1-use
      prompt: >-
        Add a `--blame` flag to `gh browse` that opens the blame view for a
        file, including for a `file:<start>-<end>` line range. The blame URL
        shape differs from the existing blob view in its query parameter usage;
        keep the existing blob line-range URL unchanged. Preserve literal
        slashes in nested paths. Add focused package regressions for a blame
        range, the existing blob range, a single line, and a nested path.
    expectedContext:
      description: >-
        The blame view URL omits the plain=1 query param that the blob line
        view requires; both keep capital-L anchors on both bounds and literal
        slashes in nested paths.
      keywords:
        - browse
        - blame
        - plain=1
        - line range
        - escape
    seededContext:
      renderedContext: |
        - [memory] gh-cli/browse-line-range-url: `gh browse <file>:<start>-<end>` builds `blob/<ref>/<path>?plain=1#L<start>-L<end>`. The `?plain=1` query parameter is REQUIRED for the blob view whenever a line number is present (it forces the raw blob view so the anchor resolves), and the anchor uses a capital L on BOTH bounds (`L12-L20`, never `L12-20`); a single line uses `#L<n>`. The blame view differs: `gh browse --blame <file>:<a>-<b>` builds `blame/<ref>/<path>#L<a>-L<b>` with NO `?plain=1` (blame is already a non-rendered view). Path segments are URL-escaped but slashes stay literal (escape everything except `/`). Regressions should pin a blame range, the blob range, a single line, and a nested path.
