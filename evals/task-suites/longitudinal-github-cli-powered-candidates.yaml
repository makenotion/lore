version: 1
runner: task
longitudinal: true
name: lore-longitudinal-github-cli-powered-candidates
description: |
  Expanded PR-derived and generalized GitHub CLI longitudinal scenario
  candidates. These are candidate slots, not independent statistical units:
  many scenarios intentionally cluster around the same source memory or source
  pull request. The suite is a calibrated scenario pool, not a fixed balanced
  dataset: capability-edge demotions and new hard-candidate additions make the
  pool proportions uneven over time. Powered runs should sample explicit
  easy/medium/hard counts from the pool with a recorded seed rather than
  treating authored bucket proportions as the benchmark distribution.
  Each scenario still needs validation for prompt bounds, verifier stability,
  no-op baseline failure, runtime, and cost before promotion.
seededCorpus: ../vault-seeds/github-cli-powered.yaml
costKillSwitchUsd: 1500
conditions:
  - no-memory
  - seeded-lore
  - lore-full-loop

scenarios:
  - id: gh-cli-config-list-json-continuity
    difficulty: easy
    agent: codex
    timeoutMs: 1800000
    workspace: &ghCliWorkspace
      kind: git
      repo: cli/cli
      sha: 9a593ce81b593dee752cc11737d1a3ef768e52b3
    phaseA:
      promptId: gh-cli-config-get-json-formation
      prompt: |
        In GitHub CLI's config command implementation, inspect command-local
        option wiring, output writers, and tests. Capture the smallest
        convention needed to add a machine-readable output mode to a sibling
        config command. Keep any edit scoped to that package.
    phaseB:
      promptId: gh-cli-config-list-json-use
      prompt: |
        Continue the config command work by adding `gh config list --json`.
        Emit an array of objects with `key` and `value` string fields to
        `opts.IO.Out`, preserve the existing human `key=value` output, and keep
        tests package-local.
        Name the new regression test `TestConfigListJsonContinuity`.
    expectedContext:
      description: Config JSON output uses a JSONOutput option, --json flag, IO.Out, and package-local tests.
      keywords: ["JSONOutput", "--json", "IO.Out", "config"]
    seededContext:
      renderedContext: |
        - [memory] gh-cli/config-json: Config command JSON output uses a `JSONOutput bool` option, a `--json` flag, JSON written to `opts.IO.Out`, and package-local flag/run tests.
      contextIds: ["gh-cli/config-json"]
    verifiers:
      - type: file-contents-match
        path: pkg/cmd/config/list/list.go
        pattern: "JSONOutput|Exporter|AddJSONFlags"
      - type: file-contents-match
        path: pkg/cmd/config/list/list_test.go
        pattern: "--json"
      - type: file-contents-match
        path: pkg/cmd/config/list/list_test.go
        pattern: "TestConfigListJsonContinuity"
      - type: command
        command: go
        args: ["test", "./pkg/cmd/config/list"]
        timeoutMs: 300000

