version: 1
runner: task
longitudinal: true
name: lore-longitudinal-github-cli-contracts-v2
description: >-
  GitHub CLI command/output-contract longitudinal suite, batch 2. Phase B asks
  for a concrete behavior whose non-inferable rule (an anchored qualifier-reject
  regex with zero requests, an exit-code flip gated to a flag, a guard that must
  sit inside a len(args) bound, an empty-object delete payload, a per-type
  endpoint split with two-field dedup, a literal resolution token, an asymmetric
  state-machine exit) is absent or wrong at the pinned SHA. Memory supplies the
  contract; hidden verifiers gate on the contract tokens and a package go test
  the agent must author.
seededCorpus: ../vault-seeds/github-cli-contracts-v2.yaml
conditions:
  - no-memory
  - seeded-lore
  - lore-full-loop
scenarios:
  - id: gh-cli-issue-list-reject-pr-search-qualifiers-v2
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace:
      kind: git
      repo: cli/cli
      sha: 628dea6e52252445cca76c2bd4f5672703800023
    phaseA:
      promptId: gh-cli-issue-list-reject-pr-search-qualifiers-v2-formation
      prompt: >-
        We will harden `gh issue list --search` in a later session so it refuses
        pull-request-only search qualifiers before issuing any request. Inspect
        `gh issue list`, the two search backends in
        `pkg/cmd/issue/list/http.go` (`listIssues` non-search path versus
        `searchIssues` advanced-search path), how `filters.Search` flows into
        the search request, the httpmock-based package tests, and how sibling
        commands reject invalid input early. Produce a durable implementation
        plan only; do not edit files. The plan must resolve which qualifier
        tokens count as pull-request-only, the exact shape of the matcher
        (anchoring and case-sensitivity), which function the guard belongs in so
        no request is issued when it fires, and the regressions that pin both
        the rejection and the no-request guarantee.
    phaseB:
      promptId: gh-cli-issue-list-reject-pr-search-qualifiers-v2-use
      prompt: >-
        Make `gh issue list --search` reject pull-request-only search qualifiers
        before any API call. Place the guard on the correct search path, match
        the pull-request qualifier tokens precisely without tripping on
        substrings, return the exact error that redirects the user to the
        pull-request listing command, and issue zero requests when it fires.
        Non-PR queries must still reach the search backend. Add focused package
        regressions proving the rejection issues no requests and that a normal
        query still hits the network.
    expectedContext:
      description: >-
        Issue list must reject is:pr / type:pr / type:pull-request search
        qualifiers in searchIssues with an anchored case-insensitive regex, the
        exact gh-pr-list error, and zero API requests.
      keywords:
        - issue list
        - search
        - is:pr
        - searchIssues
        - regexp
    seededContext:
      renderedContext: |
        - [memory] gh-cli/issue-list-pr-qualifier-reject: `gh issue list --search` must reject pull-request-only search qualifiers BEFORE issuing any request. The guard lives in `searchIssues` in `pkg/cmd/issue/list/http.go` (the advanced-search path), not the non-search `listIssues` path. Match with the case-insensitive ANCHORED word-boundary regex `(?i)\b(?:is|type):(?:pr|pull-?request)\b` — it must reject `is:pr`, `type:pr`, `type:pull-request`, and `type:pullrequest` but must NOT trip on substrings such as `mispr` or `description:prologue`. When it matches, return the exact error `cannot use pull request search qualifiers with ` + "`" + `gh issue list` + "`" + `; use ` + "`" + `gh pr list` + "`" + ` instead` and perform ZERO API calls. Non-PR queries still hit the search backend normally. Use a `regexp.MustCompile` package var, not `strings.Contains`. Regressions should assert the exact error AND `assert.Len(reg.Requests, 0)` for `Search: "is:pr"`.
      contextIds:
        - gh-cli/issue-list-pr-qualifier-reject
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/.lore-hidden-verify.mjs b/.lore-hidden-verify.mjs
          new file mode 100644
          index 0000000..0000000
          --- /dev/null
          +++ b/.lore-hidden-verify.mjs
          @@ -0,0 +1,26 @@
          +import fs from 'node:fs';
          +import path from 'node:path';
          +const NL = String.fromCharCode(10);
          +function read(p) { return fs.readFileSync(p, 'utf8'); }
          +function assert(cond, msg) { if (!cond) throw new Error(msg); }
          +function filesUnder(dir) {
          +  const out = [];
          +  for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
          +    const p = path.join(dir, ent.name);
          +    if (ent.isDirectory()) out.push(...filesUnder(p));
          +    else out.push(p);
          +  }
          +  return out;
          +}
          +const dir = 'pkg/cmd/issue/list';
          +const impl = filesUnder(dir).filter(f => f.endsWith('.go') && !f.endsWith('_test.go')).map(read).join(NL);
          +const tests = filesUnder(dir).filter(f => f.endsWith('_test.go')).map(read).join(NL);
          +assert(/cannot use pull request search qualifiers/.test(impl), 'the exact pull-request-qualifier rejection message is missing');
          +assert(/gh pr list/.test(impl), 'the rejection does not point the user at gh pr list');
          +assert(/func searchIssues[\s\S]{0,400}(pull request search qualifiers|MatchString|pullRequestSearch)/.test(impl), 'the guard is not inside the searchIssues advanced-search path');
          +assert(/regexp\.MustCompile\([^)]*(is\|type|is\)|\(\?i\))/.test(impl) || /\(\?i\)\\b\(\?:is\|type\):/.test(impl), 'a case-insensitive anchored qualifier regexp is not used');
          +assert(!/strings\.Contains\([^)]*(is:pr|type:pr|pull)/.test(impl), 'an unanchored strings.Contains matcher over-rejects');
          +assert(/is:pr|type:pr|pull-?request/.test(tests), 'tests do not exercise a pull-request qualifier');
          +assert(/reg\.Requests|len\(reg\.Requests\)|assert\.Len\(\s*t\s*,\s*reg\.Requests|reg\.Verify/.test(tests), 'tests do not assert zero requests are issued when the guard fires');
        command: bash
        args:
          - -lc
          - node .lore-hidden-verify.mjs && go test ./pkg/cmd/issue/list -count=1
        timeoutMs: 300000
