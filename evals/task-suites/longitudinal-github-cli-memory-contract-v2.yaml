version: 1
runner: task
longitudinal: true
name: lore-longitudinal-github-cli-memory-contract-v2
description: "Memory-contract v2 pilot: Phase A explicitly captures the same
  feature contract that seeded context and hidden verifiers measure."
conditions:
  - no-memory
  - seeded-lore
  - lore-full-loop
scenarios:
  - id: gh-cli-autolink-edit-replacement-memory-contract-v2
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace: &a1
      kind: git
      repo: cli/cli
      sha: 9a593ce81b593dee752cc11737d1a3ef768e52b3
    phaseA:
      promptId: gh-cli-autolink-edit-replacement-memory-contract-v2-formation
      prompt: "We will implement a follow-up feature in a later session: gh repo
        autolink edit <id>. Inspect repo autolink create/list/view/delete
        command structure, REST clients, fields, confirmation prompts, and
        admin-error handling. Produce a durable implementation plan only; do not
        edit files. The plan must resolve whether the codebase supports a
        PATCH/update endpoint or whether edit should be delete-and-recreate
        replacement semantics, and it must specify command registration, flags,
        no-field validation, tests, and user-facing replacement/new-ID
        messaging."
    phaseB:
      promptId: gh-cli-autolink-edit-replacement-memory-contract-v2-use
      prompt: Implement the autolink edit follow-up exactly as planned in the prior
        investigation.
    expectedContext:
      description: Autolink edit should follow the repo-supported update model,
        including registration, optional fields, no-field validation, tests, and
        replacement/new-ID messaging if PATCH is unavailable.
      keywords:
        - autolink
        - edit
        - replacement
        - delete
        - create
    seededContext:
      renderedContext: "- [memory] gh-cli/autolink-edit-replacement: Add `gh repo
        autolink edit <id>` as a sibling autolink command. The repository
        autolinks surface used here has list/create/view/delete but no supported
        PATCH/update route, so implement edit as view current autolink, delete
        it, then create a replacement with changed `--key-prefix`,
        `--url-template`, and numeric/alphanumeric fields. Reject no-field edits
        before HTTP. Help text and confirmation prompts should disclose that
        replacement may create a new ID. Preserve create/view/delete-style
        admin/404 handling and add package-local tests for registration,
        validation, replacement request order, and user messaging."
      contextIds:
        - gh-cli/autolink-edit-replacement
    verifiers:
      - type: patched-command
        patch: >
          diff --git a/.lore-hidden-verify.mjs b/.lore-hidden-verify.mjs

          new file mode 100644

          index 0000000..0000000

          --- /dev/null

          +++ b/.lore-hidden-verify.mjs

          @@ -0,0 +1,30 @@

          +import fs from 'node:fs';

          +import path from 'node:path';

          +const NL = String.fromCharCode(10);

          +function read(p) { return fs.readFileSync(p, 'utf8'); }

          +function exists(p) { return fs.existsSync(p); }

          +function assert(cond, msg) { if (!cond) throw new Error(msg); }

          +function filesUnder(dir) {

          +  const out = [];

          +  for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {

          +    const p = path.join(dir, ent.name);

          +    if (ent.isDirectory()) out.push(...filesUnder(p));

          +    else out.push(p);

          +  }

          +  return out;

          +}

          +

          +assert(exists('pkg/cmd/repo/autolink/edit/edit.go'), 'missing edit
          command package');

          +const root = read('pkg/cmd/repo/autolink/autolink.go');

          +const edit = read('pkg/cmd/repo/autolink/edit/edit.go');

          +const tests = filesUnder('pkg/cmd/repo/autolink').filter(f =>
          f.endsWith('_test.go')).map(read).join(NL);

          +const combined = edit + NL + tests;

          +assert(/NewCmdEdit|cmdEdit/.test(root), 'autolink root does not
          register edit command');

          +assert(/Use:\s*"edit <id>"/.test(edit), 'edit command usage is
          missing id argument');

          +assert(/key[-_]?prefix|KeyPrefix/.test(edit) &&
          /url[-_]?template|URLTemplate/.test(edit), 'edit command lacks key/url
          fields');

          +assert(/no fields|use flags|at least one|NFlag\(\)\s*==\s*0/i.test(edit), 'edit
          command does not reject no-field edits');

          +assert(/view|View|Get|Find/.test(combined), 'replacement edit does
          not read the current autolink');

          +assert(/delete|Delete/.test(combined) &&
          /create|Create/.test(combined), 'replacement edit does not delete and
          recreate autolinks');

          +assert(/replacement|new ID|new
          id|recreate|delete.*create|create.*delete/i.test(combined), 'tests or
          help do not disclose replacement/new-ID semantics');

          +assert(/admin|404|not found/i.test(tests), 'tests do not cover
          admin/404 style');

          +assert(!/PATCH/.test(edit), 'edit command should not invent a direct
          PATCH update path');
        command: bash
        args:
          - -lc
          - node .lore-hidden-verify.mjs && go test ./pkg/cmd/repo/autolink/...
        timeoutMs: 300000
