          +	reg.Register(
          +		httpmock.QueryMatcher("GET", "runs/1234/jobs", url.Values{"per_page": []string{"100"}, "page": []string{"2"}}),
          +		httpmock.JSONResponse(shared.JobsPayload{
          +			TotalCount: 2,
