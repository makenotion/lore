  - id: gh-cli-pr-merge-queue-delete-branch-order-v1
    difficulty: hard
    agent: codex
    timeoutMs: 1800000
    workspace: *github_cli_workspace
    phaseA:
      promptId: gh-cli-pr-merge-queue-delete-branch-order-v1-formation
      prompt: >-
        We will implement a `gh pr merge --delete-branch` merge-queue follow-up
        in a later session. Inspect PR merge command flow, merge queue handling,
        auto-merge mutations, branch cleanup, fork-PR remote deletion, local git
        branch deletion, admin bypass, and package tests. Produce a durable
        implementation plan only; do not edit files. The plan should identify
        which merge-related outcomes are terminal merges and which are only
        pending queue/auto-merge states.
    phaseB:
      promptId: gh-cli-pr-merge-queue-delete-branch-order-v1-use
      prompt: >-
        Fix `gh pr merge --delete-branch` for merge-queue repositories. When a
        pull request is added to a required merge queue, do not delete the local
        branch or same-repository remote branch at enqueue time. Preserve normal
        branch deletion for direct non-queue merges and `--admin` queue bypass,
        preserve fork pull-request remote deletion protection, already-merged
        cleanup behavior, auto-merge behavior, merge strategy prompts, and
        existing output. Add focused package regressions.
    expectedContext:
      description: >-
        Merge-queue enqueue is a pending state, so delete-branch cleanup should
        run only after terminal direct/admin/non-queue merges, not after queue
        or auto-merge mutations.
      keywords:
        - pr merge
        - merge queue
        - delete-branch
        - admin
        - branch cleanup
    seededContext:
      renderedContext: |
        - [memory] gh-cli/pr-merge-queue-delete-branch-order: A merge-queue success means the PR was accepted into the queue, not merged. For required queue paths without `--admin`, `gh pr merge --delete-branch` should enqueue and report the queue message without deleting local or same-repository remote branches.
        - [memory] gh-cli/pr-merge-cleanup-queue-boundary: Branch cleanup after `gh pr merge` should depend on terminal merge state. Direct non-queue merges and `--admin` queue bypass can delete branches; queue and auto-merge paths are pending states and should leave branches alone. Fork PR remote-delete protection remains unchanged.
      contextIds:
        - gh-cli/pr-merge-queue-delete-branch-order
        - gh-cli/pr-merge-cleanup-queue-boundary
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/pkg/cmd/pr/merge/merge_queue_delete_branch_hidden_test.go b/pkg/cmd/pr/merge/merge_queue_delete_branch_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/pkg/cmd/pr/merge/merge_queue_delete_branch_hidden_test.go
          @@ -0,0 +1,103 @@
          +package merge
          +
          +import (
          +	"testing"
          +
          +	"github.com/cli/cli/v2/api"
          +	"github.com/cli/cli/v2/internal/run"
          +	"github.com/cli/cli/v2/pkg/cmd/pr/shared"
          +	"github.com/cli/cli/v2/pkg/httpmock"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +func TestHiddenMergeQueueDeleteBranchDoesNotDeleteOnEnqueue(t *testing.T) {
          +	http := initFakeHTTP()
          +	defer http.Verify(t)
          +
          +	shared.StubFinderForRunCommandStyleTests(t,
          +		"1",
          +		&api.PullRequest{
          +			ID:                  "THE-ID",
          +			Number:              1,
          +			State:               "OPEN",
          +			Title:               "The title of the PR",
          +			HeadRefName:         "blueberries",
          +			BaseRefName:         "main",
          +			MergeStateStatus:    "CLEAN",
          +			IsInMergeQueue:      false,
          +			IsMergeQueueEnabled: true,
          +		},
          +		baseRepo("OWNER", "REPO", "main"),
          +	)
          +	http.Register(
          +		httpmock.GraphQL(`mutation PullRequestAutoMerge\b`),
          +		httpmock.GraphQLMutation(`{}`, func(input map[string]interface{}) {
          +			require.Equal(t, "THE-ID", input["pullRequestId"].(string))
          +			require.Equal(t, "MERGE", input["mergeMethod"].(string))
          +		}),
          +	)
          +	http.Exclude(t, httpmock.REST("DELETE", "repos/OWNER/REPO/git/refs/heads/blueberries"))
          +
          +	cs, cmdTeardown := run.Stub()
          +	defer cmdTeardown(t)
          +	cs.Register(`git rev-parse --verify refs/heads/blueberries`, 0, "")
          +
          +	output, err := runCommand(http, nil, "blueberries", true, "pr merge 1 --merge --delete-branch")
          +
          +	require.NoError(t, err)
          +	require.Equal(t, "", output.String())
          +	require.Contains(t, output.Stderr(), "will be added to the merge queue")
          +	require.NotContains(t, output.Stderr(), "Deleted local branch")
          +	require.NotContains(t, output.Stderr(), "Deleted remote branch")
          +}
          +
          +func TestHiddenMergeQueueAdminBypassStillDeletesBranches(t *testing.T) {
          +	http := initFakeHTTP()
          +	defer http.Verify(t)
          +
          +	shared.StubFinderForRunCommandStyleTests(t,
          +		"1",
          +		&api.PullRequest{
          +			ID:                  "THE-ID",
          +			Number:              1,
          +			State:               "OPEN",
          +			Title:               "The title of the PR",
          +			HeadRefName:         "blueberries",
          +			BaseRefName:         "main",
          +			MergeStateStatus:    "CLEAN",
          +			IsInMergeQueue:      false,
          +			IsMergeQueueEnabled: true,
          +		},
          +		baseRepo("OWNER", "REPO", "main"),
          +	)
          +	http.Register(
          +		httpmock.GraphQL(`mutation PullRequestMerge\b`),
          +		httpmock.GraphQLMutation(`{}`, func(input map[string]interface{}) {
          +			require.Equal(t, "THE-ID", input["pullRequestId"].(string))
          +			require.Equal(t, "MERGE", input["mergeMethod"].(string))
          +		}),
          +	)
          +	http.Register(
          +		httpmock.REST("DELETE", "repos/OWNER/REPO/git/refs/heads/blueberries"),
          +		httpmock.StringResponse(`{}`),
          +	)
          +
          +	cs, cmdTeardown := run.Stub()
          +	defer cmdTeardown(t)
          +	cs.Register(`git rev-parse --verify refs/heads/blueberries`, 0, "")
          +	cs.Register(`git rev-parse --verify refs/heads/main`, 0, "")
          +	cs.Register(`git checkout main`, 0, "")
          +	cs.Register(`git branch -D blueberries`, 0, "")
          +	cs.Register(`git pull --ff-only`, 0, "")
          +
          +	output, err := runCommand(http, nil, "blueberries", true, "pr merge 1 --admin --merge --delete-branch")
          +
          +	require.NoError(t, err)
          +	require.Equal(t, "", output.String())
          +	require.Contains(t, output.Stderr(), "Merged pull request")
          +	require.Contains(t, output.Stderr(), "Deleted local branch blueberries")
          +	require.Contains(t, output.Stderr(), "Deleted remote branch blueberries")
          +}
        command: go
        args:
          - test
          - ./pkg/cmd/pr/merge
          - -run
          - TestHidden
          - -count=1
        timeoutMs: 300000

  - id: gh-cli-comment-last-visible-viewer-comment-v1
    difficulty: medium
