          +			TotalCount: 2,
          +			Jobs: []shared.Job{
          +				{ID: 111, RunID: 1234, Name: "deploy"},
          +				{ID: 222, RunID: 1234, Name: "deploy"},
          +			},
          +		}))
          +	reg.Exclude(t, httpmock.REST("POST", "repos/OWNER/REPO/actions/jobs/111/rerun"))
