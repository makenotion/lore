          +}
          +
          +func TestHiddenRerunJobNameRejectsAmbiguousMatchesBeforePost(t *testing.T) {
          +	reg := &httpmock.Registry{}
          +
          +	registerHiddenRunLookup(reg)
          +	reg.Register(
