      renderedContext: |
        - [memory] gh-cli/pr-close-delete-branch-worktree-guard: Before deleting a local branch for `gh pr close --delete-branch`, inspect `git worktree list --porcelain`. If the PR head branch is checked out in another worktree, skip only local branch deletion and print a clear warning; still close the PR and delete the same-repository remote branch. Current-worktree branch deletion keeps the existing default-branch checkout behavior.
        - [memory] gh-cli/destructive-git-side-effect-boundaries: PR and repo commands should separate remote mutations from local git cleanup so local safety guards do not accidentally suppress API-side effects that already passed confirmation.
      contextIds:
