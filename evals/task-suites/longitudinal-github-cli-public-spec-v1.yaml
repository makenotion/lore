    timeoutMs: 1800000
    workspace: *github_cli_workspace
    phaseA:
      promptId: gh-cli-comment-last-visible-viewer-comment-v1-formation
      prompt: >-
        We will implement a PR/issue comment last-selection follow-up in a later
        session. Inspect `gh pr comment`, `gh issue comment`, shared
        commentable logic, GraphQL comment fields, hidden/minimized comments,
        current-user filtering, edit/delete mutations, create-if-none, web/editor
