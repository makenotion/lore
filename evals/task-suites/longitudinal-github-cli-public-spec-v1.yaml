    expectedContext:
      description: >-
        Last-comment selection should happen in shared commentable logic by
        filtering to visible viewer-authored comments and choosing the newest by
        creation time.
      keywords:
        - pr comment
        - issue comment
        - edit-last
        - delete-last
        - hidden comments
    seededContext:
      renderedContext: |
        - [memory] gh-cli/comment-last-visible-viewer-comment: `gh pr comment` and `gh issue comment` share last-comment mutation logic. For `--edit-last` and `--delete-last`, select the newest non-minimized viewer-authored comment by `CreatedAt`; do not treat the last returned node as semantic last.
        - [memory] gh-cli/commentable-shared-selection-boundary: Keep selection in shared commentable code before `CommentUpdate` or `CommentDelete` so PR and issue command wrappers stay symmetric. Preserve create-if-none, web, editor, body-file, inline body, and noninteractive delete confirmation behavior.
      contextIds:
        - gh-cli/comment-last-visible-viewer-comment
        - gh-cli/commentable-shared-selection-boundary
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/pkg/cmd/pr/shared/commentable_last_hidden_test.go b/pkg/cmd/pr/shared/commentable_last_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/pkg/cmd/pr/shared/commentable_last_hidden_test.go
          @@ -0,0 +1,118 @@
          +package shared
          +
          +import (
          +	"net/http"
          +	"testing"
          +	"time"
          +
          +	"github.com/cli/cli/v2/api"
          +	"github.com/cli/cli/v2/internal/ghrepo"
          +	"github.com/cli/cli/v2/pkg/httpmock"
          +	"github.com/cli/cli/v2/pkg/iostreams"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +func TestHiddenEditLastSelectsNewestVisibleViewerComment(t *testing.T) {
          +	reg := &httpmock.Registry{}
          +	defer reg.Verify(t)
          +	reg.Register(
          +		httpmock.GraphQL(`mutation CommentUpdate\b`),
          +		httpmock.GraphQLMutation(`
          +		{ "data": { "updateIssueComment": { "issueComment": {
          +			"url": "https://github.com/OWNER/REPO/pull/123#issuecomment-new"
          +		} } } }`,
          +			func(inputs map[string]interface{}) {
          +				require.Equal(t, "new-visible", inputs["id"])
          +				require.Equal(t, "updated body", inputs["body"])
          +			}),
          +	)
          +
          +	opts := hiddenCommentableOptions(reg, hiddenUnorderedComments())
          +	opts.EditLast = true
          +	opts.InputType = InputTypeInline
          +	opts.Body = "updated body"
          +
          +	err := CommentableRun(opts)
          +
          +	require.NoError(t, err)
          +}
          +
          +func TestHiddenDeleteLastSelectsNewestVisibleViewerComment(t *testing.T) {
          +	reg := &httpmock.Registry{}
          +	defer reg.Verify(t)
          +	reg.Register(
          +		httpmock.GraphQL(`mutation CommentDelete\b`),
          +		httpmock.GraphQLMutation(`
          +		{ "data": { "deleteIssueComment": {} } }`,
          +			func(inputs map[string]interface{}) {
          +				require.Equal(t, "new-visible", inputs["id"])
          +			},
          +		),
          +	)
          +
          +	opts := hiddenCommentableOptions(reg, hiddenUnorderedComments())
          +	opts.DeleteLast = true
          +	opts.DeleteLastConfirmed = true
          +
          +	err := CommentableRun(opts)
          +
          +	require.NoError(t, err)
          +}
          +
          +func hiddenCommentableOptions(reg http.RoundTripper, comments api.Comments) *CommentableOptions {
          +	ios, _, _, _ := iostreams.Test()
          +	return &CommentableOptions{
          +		IO: ios,
          +		HttpClient: func() (*http.Client, error) {
          +			return &http.Client{Transport: reg}, nil
          +		},
          +		RetrieveCommentable: func() (Commentable, ghrepo.Interface, error) {
          +			return &api.PullRequest{
          +				ID:       "PR-ID",
          +				Number:   123,
          +				URL:      "https://github.com/OWNER/REPO/pull/123",
          +				Comments: comments,
          +			}, ghrepo.New("OWNER", "REPO"), nil
          +		},
          +	}
          +}
          +
          +func hiddenUnorderedComments() api.Comments {
          +	return api.Comments{Nodes: []api.Comment{
          +		{
          +			ID:              "new-visible",
          +			URL:             "https://github.com/OWNER/REPO/pull/123#issuecomment-new",
          +			ViewerDidAuthor: true,
          +			Body:            "new visible",
          +			CreatedAt:       hiddenTime(2026, 5, 2),
          +		},
          +		{
          +			ID:              "old-visible",
          +			URL:             "https://github.com/OWNER/REPO/pull/123#issuecomment-old",
          +			ViewerDidAuthor: true,
          +			Body:            "old visible",
          +			CreatedAt:       hiddenTime(2026, 5, 1),
          +		},
          +		{
          +			ID:              "new-hidden",
          +			URL:             "https://github.com/OWNER/REPO/pull/123#issuecomment-hidden",
          +			ViewerDidAuthor: true,
          +			Body:            "new hidden",
          +			IsMinimized:     true,
          +			CreatedAt:       hiddenTime(2026, 5, 3),
          +		},
          +		{
          +			ID:              "other-user",
          +			URL:             "https://github.com/OWNER/REPO/pull/123#issuecomment-other",
          +			ViewerDidAuthor: false,
          +			Body:            "other user",
          +			CreatedAt:       hiddenTime(2026, 5, 4),
          +		},
          +	}}
          +}
          +
          +func hiddenTime(year int, month time.Month, day int) time.Time {
          +	return time.Date(year, month, day, 12, 0, 0, 0, time.UTC)
          +}
        command: go
        args:
          - test
          - ./pkg/cmd/pr/shared
          - -run
          - TestHidden
          - -count=1
        timeoutMs: 300000
