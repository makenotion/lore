    phaseB:
      promptId: gh-cli-comment-last-visible-viewer-comment-v1-use
      prompt: >-
        Fix `gh pr comment` and `gh issue comment` `--edit-last` /
        `--delete-last` so "last" means the newest non-hidden comment authored
        by the current viewer, regardless of the local order of returned comment
        nodes. Preserve `--create-if-none`, web mode, editor and body-file
        flows, inline comment updates, noninteractive delete confirmation, and
