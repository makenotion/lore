        - [memory] gh-cli/pr-create-fill-first-boundary: Merge filtering should not change explicit fill mode precedence, title/body overrides, base/head range selection, or existing single-commit autofill. Tests should cover the shared git commit reader and PR create autofill behavior.
      contextIds:
        - gh-cli/pr-create-fill-skip-merge-commits
        - gh-cli/pr-create-fill-first-boundary
    verifiers:
      - type: patched-command
        patch: |
          diff --git a/git/commits_merge_hidden_test.go b/git/commits_merge_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/git/commits_merge_hidden_test.go
          @@ -0,0 +1,86 @@
          +package git
          +
          +import (
          +	"context"
          +	"fmt"
          +	"os"
          +	"os/exec"
          +	"strings"
          +	"testing"
          +
          +	"github.com/stretchr/testify/require"
          +)
          +
          +const (
          +	hiddenMergeSha  = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          +	hiddenFeatureSha = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          +	hiddenTestSha    = "cccccccccccccccccccccccccccccccccccccccc"
          +)
          +
          +func TestHiddenClientCommitsSkipsMergeCommits(t *testing.T) {
          +	cmd, cmdCtx := hiddenCommitsCommandContext(t)
          +	client := Client{
          +		GitPath:        "path/to/git",
          +		commandContext: cmdCtx,
          +	}
          +
          +	commits, err := client.Commits(context.Background(), "origin/main", "feature")
          +
          +	require.NoError(t, err)
          +	require.Equal(t, []*Commit{
          +		{Sha: hiddenFeatureSha, Title: "feature work", Body: "body one"},
          +		{Sha: hiddenTestSha, Title: "test updates", Body: "body two"},
          +	}, commits)
          +	require.NotContains(t, strings.Join(cmd.Args, " "), "Merge branch")
          +}
          +
          +func TestHiddenCommitsHelperProcess(t *testing.T) {
          +	if os.Getenv("GH_HIDDEN_COMMITS_HELPER") != "1" {
          +		return
          +	}
          +
          +	args := strings.Join(os.Args, " ")
          +	if strings.Contains(args, "--no-merges") {
          +		fmt.Fprint(os.Stdout, oldCommitRecord(hiddenFeatureSha, "feature work", "body one"))
          +		fmt.Fprint(os.Stdout, oldCommitRecord(hiddenTestSha, "test updates", "body two"))
          +		os.Exit(0)
          +	}
          +	if strings.Contains(args, "%P") {
          +		fmt.Fprint(os.Stdout, parentCommitRecord(hiddenMergeSha, "1111111111111111111111111111111111111111 2222222222222222222222222222222222222222", "Merge branch 'main' into feature", "noise"))
          +		fmt.Fprint(os.Stdout, parentCommitRecord(hiddenFeatureSha, "3333333333333333333333333333333333333333", "feature work", "body one"))
          +		fmt.Fprint(os.Stdout, parentCommitRecord(hiddenTestSha, "4444444444444444444444444444444444444444", "test updates", "body two"))
          +		os.Exit(0)
          +	}
          +
          +	fmt.Fprint(os.Stdout, oldCommitRecord(hiddenMergeSha, "Merge branch 'main' into feature", "noise"))
          +	fmt.Fprint(os.Stdout, oldCommitRecord(hiddenFeatureSha, "feature work", "body one"))
          +	fmt.Fprint(os.Stdout, oldCommitRecord(hiddenTestSha, "test updates", "body two"))
          +	os.Exit(0)
          +}
          +
          +func oldCommitRecord(sha, title, body string) string {
          +	return sha + "\x00" + title + "\x00" + body + "\x00\n"
          +}
          +
          +func parentCommitRecord(sha, parents, title, body string) string {
          +	return sha + "\x00" + parents + "\x00" + title + "\x00" + body + "\x00\n"
          +}
          +
          +func hiddenCommitsCommandContext(t *testing.T) (*exec.Cmd, commandCtx) {
          +	t.Helper()
          +	cmd := exec.CommandContext(context.Background(), os.Args[0], "-test.run=TestHiddenCommitsHelperProcess", "--")
          +	cmd.Env = append(os.Environ(), "GH_HIDDEN_COMMITS_HELPER=1")
          +	return cmd, func(ctx context.Context, exe string, args ...string) *exec.Cmd {
          +		cmd.Args = append(cmd.Args, exe)
          +		cmd.Args = append(cmd.Args, args...)
          +		return cmd
          +	}
          +}
        command: go
        args:
          - test
          - ./git
          - ./pkg/cmd/pr/create
          - -count=1
        timeoutMs: 300000

