    verifiers:
      - type: patched-command
        patch: |
          diff --git a/pkg/cmd/pr/close/close_hidden_test.go b/pkg/cmd/pr/close/close_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/pkg/cmd/pr/close/close_hidden_test.go
          @@ -0,0 +1,57 @@
          +package close
          +
          +import (
          +	"testing"
          +
          +	"github.com/MakeNowJust/heredoc"
          +	"github.com/cli/cli/v2/pkg/cmd/pr/shared"
          +	"github.com/cli/cli/v2/internal/run"
          +	"github.com/cli/cli/v2/pkg/httpmock"
          +	"github.com/stretchr/testify/assert"
          +)
          +
          +func TestHiddenPrCloseDeleteBranchSkipsLocalBranchCheckedOutInOtherWorktree(t *testing.T) {
          +	http := &httpmock.Registry{}
          +	defer http.Verify(t)
          +
          +	baseRepo, pr := stubPR("OWNER/REPO", "OWNER/REPO:blueberries")
          +	pr.Title = "The title of the PR"
          +	shared.StubFinderForRunCommandStyleTests(t, "96", pr, baseRepo)
          +
          +	http.Register(
          +		httpmock.GraphQL(`mutation PullRequestClose\b`),
          +		httpmock.GraphQLMutation(`{"id": "THE-ID"}`,
          +			func(inputs map[string]interface{}) {
          +				assert.Equal(t, inputs["pullRequestId"], "THE-ID")
          +			}),
          +	)
          +	http.Register(
          +		httpmock.REST("DELETE", "repos/OWNER/REPO/git/refs/heads/blueberries"),
          +		httpmock.StringResponse(`{}`))
          +
          +	cs, cmdTeardown := run.Stub()
          +	defer cmdTeardown(t)
          +
          +	cs.Register(`git rev-parse --verify refs/heads/blueberries`, 0, "")
          +	cs.Register(`git rev-parse --show-toplevel`, 0, "/repo\n")
          +	cs.Register(`git worktree list --porcelain`, 0, heredoc.Doc(`
          +		worktree /repo
          +		HEAD 1111111111111111111111111111111111111111
          +		branch refs/heads/trunk
          +
          +		worktree /tmp/other-worktree
          +		HEAD 2222222222222222222222222222222222222222
          +		branch refs/heads/blueberries
          +	`))
          +
          +	output, err := runCommand(http, true, `96 --delete-branch`)
          +
          +	assert.NoError(t, err)
          +	assert.Equal(t, "", output.String())
          +	assert.Contains(t, output.Stderr(), "Closed pull request OWNER/REPO#96")
          +	assert.Contains(t, output.Stderr(), "Skipped deleting the local branch")
          +	assert.Contains(t, output.Stderr(), "blueberries")
          +	assert.Contains(t, output.Stderr(), "worktree")
          +	assert.Contains(t, output.Stderr(), "Deleted branch blueberries")
          +}
        command: go
        args:
          - test
          - ./pkg/cmd/pr/close
          - -count=1
