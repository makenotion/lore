          diff --git a/pkg/cmd/workflow/run/run_hidden_test.go b/pkg/cmd/workflow/run/run_hidden_test.go
          new file mode 100644
          --- /dev/null
          +++ b/pkg/cmd/workflow/run/run_hidden_test.go
          @@ -0,0 +1,164 @@
          +package run
          +
          +import (
          +	"encoding/base64"
          +	"encoding/json"
          +	"io"
          +	"net/http"
          +	"net/url"
          +	"os"
          +	"testing"
          +
          +	"github.com/cli/cli/v2/api"
          +	fd "github.com/cli/cli/v2/internal/featuredetection"
          +	"github.com/cli/cli/v2/internal/ghrepo"
          +	"github.com/cli/cli/v2/pkg/cmd/workflow/shared"
          +	"github.com/cli/cli/v2/pkg/httpmock"
          +	"github.com/cli/cli/v2/pkg/iostreams"
          +	"github.com/stretchr/testify/assert"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +const hiddenWorkflowInputYAML = `name: hidden inputs
          +on:
          +  workflow_dispatch:
          +    inputs:
          +      env:
          +        type: choice
          +        required: true
          +        options:
          +          - prod
          +          - staging
          +      config:
          +        description: config body
          +        required: true
          +      dry_run:
          +        type: boolean
          +        default: "false"
          +      note:
          +        description: optional note
          +jobs:
          +  test:
          +    runs-on: ubuntu-latest
          +    steps:
          +      - run: echo ok
          +`
          +
          +func hiddenRunOptions(reg *httpmock.Registry, ref string) *RunOptions {
          +	ios, _, _, _ := iostreams.Test()
          +	return &RunOptions{
          +		HttpClient: func() (*http.Client, error) {
          +			return &http.Client{Transport: reg}, nil
          +		},
          +		IO:       ios,
          +		Selector: "workflow.yml",
          +		Ref:      ref,
          +		Detector: &fd.DisabledDetectorMock{},
          +		BaseRepo: func() (ghrepo.Interface, error) {
          +			return api.InitRepoHostname(&api.Repository{
          +				Name:             "REPO",
          +				Owner:            api.RepositoryOwner{Login: "OWNER"},
          +				DefaultBranchRef: api.BranchRef{Name: "trunk"},
          +			}, "github.com"), nil
          +		},
          +	}
          +}
          +
          +func stubHiddenWorkflowAndContent(reg *httpmock.Registry, ref string) {
          +	reg.Register(
          +		httpmock.REST("GET", "repos/OWNER/REPO/actions/workflows/workflow.yml"),
          +		httpmock.JSONResponse(shared.Workflow{
          +			Path: ".github/workflows/workflow.yml",
          +			ID:   12345,
          +		}))
          +	reg.Register(
          +		httpmock.QueryMatcher("GET", "repos/OWNER/REPO/contents/.github/workflows/workflow.yml", url.Values{"ref": []string{ref}}),
          +		httpmock.JSONResponse(struct{ Content string }{
          +			Content: base64.StdEncoding.EncodeToString([]byte(hiddenWorkflowInputYAML)),
          +		}))
          +}
          +
          +func TestHiddenWorkflowRunValidatesNoninteractiveInputsBeforeDispatch(t *testing.T) {
          +	tests := []struct {
          +		name      string
          +		configure func(*RunOptions)
          +		wantErr   string
          +	}{
          +		{
          +			name: "json unknown input",
          +			configure: func(opts *RunOptions) {
          +				opts.JSONInput = `{"env":"prod","config":"ok","extra":"nope"}`
          +			},
          +			wantErr: "extra",
          +		},
          +		{
          +			name: "raw missing required input",
          +			configure: func(opts *RunOptions) {
          +				opts.RawFields = []string{"env=prod"}
          +			},
          +			wantErr: "config",
          +		},
          +		{
          +			name: "raw invalid choice",
          +			configure: func(opts *RunOptions) {
          +				opts.RawFields = []string{"env=dev", "config=ok"}
          +			},
          +			wantErr: "env",
          +		},
          +		{
          +			name: "json invalid boolean",
          +			configure: func(opts *RunOptions) {
          +				opts.JSONInput = `{"env":"prod","config":"ok","dry_run":"maybe"}`
          +			},
          +			wantErr: "dry_run",
          +		},
          +	}
          +
          +	for _, tt := range tests {
          +		t.Run(tt.name, func(t *testing.T) {
          +			reg := &httpmock.Registry{}
          +			defer reg.Verify(t)
          +			stubHiddenWorkflowAndContent(reg, "feature/slash")
          +			reg.Exclude(t, httpmock.REST("POST", "repos/OWNER/REPO/actions/workflows/12345/dispatches"))
          +			opts := hiddenRunOptions(reg, "feature/slash")
          +			tt.configure(opts)
          +
          +			err := runRun(opts)
          +
          +			require.Error(t, err)
          +			assert.Contains(t, err.Error(), tt.wantErr)
          +		})
          +	}
          +}
          +
          +func TestHiddenWorkflowRunValidationPreservesFileFieldsAndSelectedRef(t *testing.T) {
          +	reg := &httpmock.Registry{}
          +	defer reg.Verify(t)
          +	stubHiddenWorkflowAndContent(reg, "feature/slash")
          +	reg.Register(
          +		httpmock.REST("POST", "repos/OWNER/REPO/actions/workflows/12345/dispatches"),
          +		func(req *http.Request) (*http.Response, error) {
          +			body, err := io.ReadAll(req.Body)
          +			require.NoError(t, err)
          +			var payload map[string]any
          +			require.NoError(t, json.Unmarshal(body, &payload))
          +			assert.Equal(t, "feature/slash", payload["ref"])
          +			inputs, ok := payload["inputs"].(map[string]any)
          +			require.True(t, ok)
          +			assert.Equal(t, "prod", inputs["env"])
          +			assert.Equal(t, "expanded file contents", inputs["config"])
          +			assert.Equal(t, "true", inputs["dry_run"])
          +			return httpmock.StatusStringResponse(http.StatusNoContent, "")(req)
          +		})
          +	configFile, err := os.CreateTemp(t.TempDir(), "config-*.txt")
          +	require.NoError(t, err)
          +	_, err = configFile.WriteString("expanded file contents")
          +	require.NoError(t, err)
          +	require.NoError(t, configFile.Close())
          +
          +	opts := hiddenRunOptions(reg, "feature/slash")
          +	opts.RawFields = []string{"env=prod", "dry_run=true"}
          +	opts.MagicFields = []string{"config=@" + configFile.Name()}
          +
          +	require.NoError(t, runRun(opts))
          +}
        command: go
        args:
          - test
          - ./pkg/cmd/workflow/run
          - -count=1
        timeoutMs: 300000

