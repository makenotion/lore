          new file mode 100644
          --- /dev/null
          +++ b/pkg/cmd/api/api_input_query_hidden_test.go
          @@ -0,0 +1,87 @@
          +package api
          +
          +import (
          +	"io"
          +	"net/http"
          +	"os"
          +	"testing"
          +
          +	"github.com/cli/cli/v2/internal/config"
          +	"github.com/cli/cli/v2/internal/gh"
          +	"github.com/cli/cli/v2/pkg/iostreams"
          +	"github.com/stretchr/testify/require"
          +)
          +
          +type hiddenRoundTripper func(*http.Request) (*http.Response, error)
          +
          +func (f hiddenRoundTripper) RoundTrip(req *http.Request) (*http.Response, error) {
          +	return f(req)
          +}
          +
          +func TestHiddenInputFieldsPreserveNestedQueryKeys(t *testing.T) {
          +	inputFile, err := os.CreateTemp(t.TempDir(), "payload-*.json")
          +	require.NoError(t, err)
          +	_, err = inputFile.WriteString(`{"enabled":true}`)
          +	require.NoError(t, err)
          +	require.NoError(t, inputFile.Close())
          +
          +	ios, _, _, _ := iostreams.Test()
          +	var gotBody []byte
          +	var gotRequest *http.Request
          +
          +	opts := ApiOptions{
          +		RequestPath:      "orgs/OWNER/properties/schema",
          +		RequestInputFile: inputFile.Name(),
          +		RawFields: []string{
          +			"filters[state]=open",
          +			"labels[]=bug",
          +			"labels[]=regression",
          +		},
          +		MagicFields: []string{
          +			"properties[][property_name]=environment",
          +			"properties[][default_value]=production",
          +			"properties[][allowed_values][]=staging",
          +			"properties[][allowed_values][]=production",
          +			"properties[][property_name]=region",
          +			"properties[][default_value]=us-east-1",
          +			"enabled=true",
          +			"count=2",
          +		},
          +		IO: ios,
          +		Config: func() (gh.Config, error) {
          +			return config.NewBlankConfig(), nil
          +		},
          +		HttpClient: func() (*http.Client, error) {
          +			return &http.Client{Transport: hiddenRoundTripper(func(req *http.Request) (*http.Response, error) {
          +				var err error
          +				gotBody, err = io.ReadAll(req.Body)
          +				require.NoError(t, err)
          +				gotRequest = req
          +				return &http.Response{
          +					StatusCode: http.StatusNoContent,
          +					Body:       io.NopCloser(nil),
          +					Request:    req,
          +				}, nil
          +			})}, nil
          +		},
          +	}
          +
          +	err = apiRun(&opts)
          +	require.NoError(t, err)
          +	require.NotNil(t, gotRequest)
          +	require.Equal(t, "POST", gotRequest.Method)
          +	require.Equal(t, []byte(`{"enabled":true}`), gotBody)
          +	require.Equal(t, "", gotRequest.Header.Get("Content-Type"))
          +
          +	query := gotRequest.URL.Query()
          +	require.Equal(t, []string{"open"}, query["filters[state]"])
          +	require.Equal(t, []string{"bug", "regression"}, query["labels[]"])
          +	require.Equal(t, []string{"environment", "region"}, query["properties[][property_name]"])
          +	require.Equal(t, []string{"production", "us-east-1"}, query["properties[][default_value]"])
          +	require.Equal(t, []string{"staging", "production"}, query["properties[][allowed_values][]"])
          +	require.Equal(t, []string{"true"}, query["enabled"])
          +	require.Equal(t, []string{"2"}, query["count"])
          +
          +	require.Empty(t, query["state"])
          +	require.Empty(t, query["property_name"])
          +	require.Empty(t, query["default_value"])
          +	require.Empty(t, query["allowed_values[]"])
          +}
        command: go
        args:
          - test
          - ./pkg/cmd/api
          - -count=1
        timeoutMs: 300000

