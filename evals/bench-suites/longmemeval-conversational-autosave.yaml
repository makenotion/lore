runner: bench
benchmark: longmemeval
suite: longmemeval-conversational-autosave
corpus:
  name: longmemeval_s_cleaned
  path: evals/bench-corpora/longmemeval/longmemeval_s_cleaned.json
agent:
  model: gpt-4o-mini-2024-07-18
  adapter: codex
  systemPrompt: evals/prompts/longmemeval-agent-system-wake-up.txt
  retrieval: wake-up-prefetch
judge:
  model: gpt-4o-2024-08-06
  recallPrompt: evals/prompts/longmemeval-judge.txt
  abstentionPrompt: evals/prompts/longmemeval-judge-abstention.txt
ingestion:
  strategy: lore-mine
  memoryCaptureMode: conversational
caps:
  perExampleWrites: 500
  perSuiteWrites: 250000
notes: |
  Production conversation-mining ingestion with the opt-in conversational
  capture policy. Compare against longmemeval.yaml for durable production
  autosave and longmemeval-simulated-autosave.yaml for model-structured
  extraction that bypasses the hook prompt.
