version: 1
name: lore-core
description: Small synthetic suite that checks whether useful Lore memory surfaces for representative tasks.
trials: 1
runner: retrieval

tasks:
  - id: respects-governing-auth-decision
    prompt: |
      Add the requested browser feature while following the project's established auth decision.
      Avoid introducing the deprecated auth path.
    memoryScenarios:
      no-lore: ../memory/no-lore.yaml
      empty-lore: ../memory/empty.yaml
      noisy-memory: ../memory/noisy.yaml
      stale-memory: ../memory/stale-auth-decision.yaml
      helpful-memory: ../memory/auth-decision.yaml
    retrieval:
      limit: 3
    expectedRetrieval:
      no-lore:
        shouldSurface: []
        shouldNotSurface:
          - decision/auth-model
      empty-lore:
        shouldSurface: []
        shouldNotSurface:
          - decision/auth-model
      noisy-memory:
        shouldSurface: []
        shouldNotSurface:
          - decision/auth-model
      # Asserts the status-aware retriever drops the superseded row before it
      # reaches the agent. Forbids the stale id directly (not the helpful id),
      # so a regression that removes the status filter surfaces here as harm.
      stale-memory:
        shouldSurface: []
        shouldNotSurface:
          - decision/auth-bearer-tokens-superseded
      helpful-memory:
        shouldSurface:
          - decision/auth-model
        shouldNotSurface:
          - note/general-ui-polish

  - id: prefers-current-test-runner
    prompt: |
      Add a unit test for the new payment validator using the project's current test runner.
      Do not adopt the superseded runner.
    memoryScenarios:
      no-lore: ../memory/no-lore.yaml
      empty-lore: ../memory/empty.yaml
      noisy-memory: ../memory/noisy-test-runner.yaml
      stale-memory: ../memory/stale-test-runner.yaml
      helpful-memory: ../memory/test-runner-decision.yaml
    retrieval:
      limit: 3
    expectedRetrieval:
      no-lore:
        shouldSurface: []
        shouldNotSurface:
          - decision/test-runner-vitest
      empty-lore:
        shouldSurface: []
        shouldNotSurface:
          - decision/test-runner-vitest
      noisy-memory:
        shouldSurface: []
        shouldNotSurface:
          - decision/test-runner-vitest
      # Asserts the superseded jest decision is dropped before retrieval.
      stale-memory:
        shouldSurface: []
        shouldNotSurface:
          - decision/test-runner-jest-superseded
      helpful-memory:
        shouldSurface:
          - decision/test-runner-vitest
        shouldNotSurface:
          - note/yaml-snapshot-hygiene

  - id: returns-result-from-service-boundary
    prompt: |
      Add a new service method that fetches the user profile and returns the project's standard
      error-handling shape. Do not adopt the superseded throw-based pattern.
    memoryScenarios:
      no-lore: ../memory/no-lore.yaml
      empty-lore: ../memory/empty.yaml
      noisy-memory: ../memory/noisy-error-handling.yaml
      stale-memory: ../memory/stale-error-handling.yaml
      helpful-memory: ../memory/error-handling-decision.yaml
    retrieval:
      limit: 3
    expectedRetrieval:
      no-lore:
        shouldSurface: []
        shouldNotSurface:
          - decision/error-handling-result-type
      empty-lore:
        shouldSurface: []
        shouldNotSurface:
          - decision/error-handling-result-type
      noisy-memory:
        shouldSurface: []
        shouldNotSurface:
          - decision/error-handling-result-type
      # Asserts the superseded throw-based decision is dropped before retrieval.
      stale-memory:
        shouldSurface: []
        shouldNotSurface:
          - decision/error-handling-throw-superseded
      helpful-memory:
        shouldSurface:
          - decision/error-handling-result-type
        shouldNotSurface:
          - note/structured-log-fields

  - id: follows-incident-runbook
    prompt: |
      A Redis primary appears stuck. Recover the cluster by following the project's runbook.
    memoryScenarios:
      no-lore: ../memory/no-lore.yaml
      empty-lore: ../memory/empty.yaml
      helpful-memory: ../memory/incident-runbook-helpful.yaml
    retrieval:
      limit: 3
    expectedRetrieval:
      helpful-memory:
        shouldSurface:
          - runbook/redis-failover
        shouldNotSurface:
          - note/cache-warmup-quirks

  - id: uses-current-deployment-pattern
    prompt: |
      Roll out the new orders service version using the project's current deployment pattern.
    memoryScenarios:
      no-lore: ../memory/no-lore.yaml
      empty-lore: ../memory/empty.yaml
      helpful-memory: ../memory/deployment-pattern-helpful.yaml
    retrieval:
      limit: 3
    expectedRetrieval:
      helpful-memory:
        shouldSurface:
          - decision/canary-deployments
        shouldNotSurface:
          - note/tail-latency-tracking

  - id: respects-data-retention-policy
    prompt: |
      Add a customer-data feature that complies with the project's data retention policy.
    memoryScenarios:
      no-lore: ../memory/no-lore.yaml
      empty-lore: ../memory/empty.yaml
      helpful-memory: ../memory/data-retention-helpful.yaml
    retrieval:
      limit: 3
    expectedRetrieval:
      helpful-memory:
        shouldSurface:
          - policy/data-retention-90-days
        shouldNotSurface:
          - note/dashboard-color-palette

  # ── wake-up.memories (recents) surface ────────────────────────────────────

  - id: surfaces-recent-architecture-decision
    prompt: Catch up on recent architectural decisions.
    surface: wake-up.memories
    memoryScenarios:
      no-lore: ../memory/no-lore.yaml
      empty-lore: ../memory/empty.yaml
      helpful-memory: ../memory/recents-architecture.yaml
    retrieval:
      # limit: 1 picks the most-recent row only — wake-up.memories
      # uses memories.list (no token-overlap filter), so limit:5 would
      # surface the distractor too and break shouldNotSurface. The
      # post-FIXTURE_BASE_DATE-flip ordering puts the helpful row
      # first by createdAt; a regression that reverses that order
      # silently breaks this test, exposing the ranking bug.
      limit: 1
    expectedRetrieval:
      helpful-memory:
        shouldSurface:
          - decision/event-sourcing-adopted
        shouldNotSurface:
          - note/recents-changelog-entry

  - id: surfaces-recent-billing-decision
