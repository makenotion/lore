  # ── wake-up.relatedMemories surface ───────────────────────────────────────

  - id: relates-payments-task-to-retry-decision
    prompt: Pick up where the team left off on payments work.
    surface: wake-up.relatedMemories
    memoryScenarios:
      no-lore: ../memory/no-lore.yaml
      empty-lore: ../memory/empty.yaml
      helpful-memory: ../memory/related-payments.yaml
    retrieval:
      # limit: 5 lets shouldNotSurface assert "the distractor must
      # not appear at all" — wake-up.relatedMemories uses
      # searchFixtureMemories which token-filters distractors with
      # zero score. A future change that broadens retrieval surfaces
      # the distractor and trips this assertion.
      limit: 5
    expectedRetrieval:
      helpful-memory:
        shouldSurface:
          - decision/payments-retry-policy
        shouldNotSurface:
          - note/dashboard-color-palette

  - id: relates-search-tuning-task-to-rrf-decision
