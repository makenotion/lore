# Lore configuration
# Copy to .lore.yaml and fill in your values.

vault:
  # Notion page ID where Lore databases live.
  # Create a page in Notion, share it with your integration, and paste the ID here.
  pageId: "your-page-id-here"

# Authentication (0.10.0+)
# Lore resolves a Notion bearer token from the first available source in
# this priority order:
#   1. NOTION_API_TOKEN env (canonical; honored by the Notion SDK)
#   2. ntn-resolved (~/.config/notion/auth.json — the 0.10.0 dogfood path;
#      run `lore auth --login` to seed it)
#   3. LORE_NOTION_TOKEN env (soft-deprecated 0.10.0; emits a one-time-
#      per-session warning; hard removal plausibly 0.11.0+)
#   4. auth.token below (soft-deprecated 0.10.0; same posture)
# Most operators leave this block alone and run `lore auth --login`.
# auth:
#   # Soft-deprecated. Only set if you cannot use ntn or NOTION_API_TOKEN.
#   token: "ntn_..."
#   # workspaceId (0.10.0): pin which workspace the ntn-token resolver picks
#   # from auth.json when multiple are present. Falls back to the
#   # NOTION_WORKSPACE_ID env var, then to single-workspace auto-pick.
#   workspaceId: "<notion-workspace-id>"

# Project definitions for monorepo support.
# Map sub-directories to named projects.
projects:
  - name: "Server"
    path: "src/server"
    tags: ["backend"]
  - name: "Client"
    path: "src/client"
    tags: ["frontend"]

# Auto-detect projects from workspace patterns (optional)
# detect:
#   patterns: ["src/*/package.json"]
#   exclude: ["node_modules"]

# AI assistant hook settings
hooks:
  autoSave: true
  wakeUp: true
  saveInterval: 5
  # learningExtraction (0.9.0/08): when true (default) the Stop-spawn autosave
  # sub-agent identifies single-fact "atomic learnings" from the session and
  # saves each as its own `note` memory, alongside the session synopsis it
  # already writes. Set to false to reproduce the 0.8.x synopsis-only shape.
  # Honors LORE_DISABLE_LEARNING_EXTRACTION=1 as well — either knob set to
  # disabled wins.
  # learningExtraction: true
