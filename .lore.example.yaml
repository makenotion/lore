# Lore configuration
# Copy this file to `.lore.yaml` in your clone and fill in the values
# below. `.lore.yaml` is local-only — keep it out of version control so
# personal vault IDs and tokens never land in a public repo. Distribute
# shared values (team `vault.pageId`, `auth.workspaceId`) via your team's
# onboarding docs, not by committing this file.

vault:
  # Notion page ID where Lore databases live. Paste the shared team
  # page ID from your team's onboarding docs, or run `lore init` to
  # bootstrap a personal vault. Replace before first run — the
  # angle-bracket placeholder is rejected at config load.
  pageId: "<your-vault-page-id>"

# Profile selector. Omit to use the runtime default in memory; new
# `lore init` configs write this explicitly.
profile: default@1.0.0

# Phase 3 profile distribution settings (optional).
#
# `profiles.allowedInstallSources` is the closed allow-list that
# authorizes `lore profile install --yes` to write under
# `.lore/profiles/installed/`. The CLI stages the source, validates
# the bundle, computes its manifest digest, and requires an exact
# entry match before touching disk. Interactive installs (without
# `--yes`) print the digest so an operator can pre-populate the list
# before CI/automation runs.
#
# Each entry is one of two shapes:
#   - kind: git, url, commit (40-hex SHA), manifestDigest (sha256:<64-hex>)
#   - kind: path, path (absolute or configRoot-relative), manifestDigest
#
# Example:
# profiles:
#   allowedInstallSources:
#     - kind: git
#       url: git@github.com:org/lore-sales-profile.git
#       commit: 0123456789abcdef0123456789abcdef01234567
#       manifestDigest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# Authentication (0.10.0+)
# Lore resolves a Notion bearer token from the first available source in
# this priority order:
#   1. NOTION_API_TOKEN env. External operators put a Notion Personal
#      Access Token here. PATs come from notion.so/developers/tokens and
#      use the `ntn_` or `development_ntn_` prefix.
#   2. ntn-resolved ~/.config/notion/auth.json. Internal operators can run
#      `lore auth --login` to seed it.
# Do not paste `secret_` integration tokens from notion.so/profile/integrations
# into team setup; they share one rate-limit bucket across operators.
# Do not place auth.token in `.lore.yaml`. Any auth.token value is rejected
# at config load time.
# auth:
#   # Pin which workspace the ntn-token resolver picks from auth.json when
#   # multiple are present. Falls back to the
#   # NOTION_WORKSPACE_ID env var, then to single-workspace auto-pick.
#   workspaceId: "<notion-workspace-id>"

# Project definitions for monorepo support.
# Map sub-directories to named projects.
projects:
  - name: "Server"
    path: "src/server"
    tags: ["backend"]
  - name: "Client"
    path: "src/client"
    tags: ["frontend"]

# Auto-detect projects from workspace patterns (optional)
# detect:
#   patterns: ["src/*/package.json"]
#   exclude: ["node_modules"]

# Local cost and usage ledger (optional, disabled by default).
# Writes redacted JSONL rows only: byte/token counts, operation counts,
# model metadata when known, and aggregate cost estimates. It does not
# store raw prompts, transcripts, MCP arguments/results, memory content,
# Notion page bodies, or response payloads.
# costTracking:
#   enabled: true
#   ledgerPath: ~/.local/share/lore/cost-ledger.jsonl
#   pricing:
#     builtinTable: openai-2026-05
#     overridesPath: ~/.config/lore/pricing.json

# AI assistant hook settings
#
# Lore wires four background hooks into your assistant by default. Writes
# land in your own Notion vault; transcript content is sent to your
# configured background-agent LLM (Claude API by default; Codex if
# LORE_AGENT_NAME=Codex). The canonical wording lives in
# `src/cli/hook-disclosure.ts` and is asserted against this block.
#
# - autoSave: on assistant Stop, a detached background sub-agent writes
#   a session synopsis to your vault as Memory rows.
# - wakeUp: on session start (or first user prompt), the hook fetches
#   recent memories, active facts, and the latest project digest and
#   injects them into the assistant's context.
# - autoDigest: after autosave, regenerates the weekly project digest in
#   a detached background spawn (one extra Notion write per project per
#   week, not per session).
# - learningExtraction: the autosave sub-agent extracts atomic
#   single-fact learnings from the transcript (up to 5 per save) and
#   writes each as its own `note` memory.
# - saveInterval: minimum minutes between autosave runs in the same
#   session, so a long pairing session doesn't write a memory on every
#   Stop event. 5 is a reasonable middle ground. Must be a positive
#   integer; setting it to `false` is invalid and will silently fall
#   back to hook defaults (re-enabling autoSave/wakeUp).
#
# Disable in .lore.yaml with any of: hooks.autoSave: false /
# hooks.wakeUp: false / hooks.autoDigest: false /
# hooks.learningExtraction: false.
# Per-session env overrides: LORE_AUTOSAVE=false / LORE_AUTO_DIGEST=false /
# LORE_DISABLE_LEARNING_EXTRACTION=1. Full reference: docs/hooks.md.
hooks:
  autoSave: true
  wakeUp: true
  saveInterval: 5
  # learningExtraction (0.9.0/08): when true (default) the Stop-spawn autosave
  # sub-agent identifies single-fact "atomic learnings" from the session and
  # saves each as its own `note` memory, alongside the session synopsis it
  # already writes. Set to false to reproduce the 0.8.x synopsis-only shape.
  # Honors LORE_DISABLE_LEARNING_EXTRACTION=1 as well — either knob set to
  # disabled wins.
  # learningExtraction: true
