name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] package-manager caching is disabled because this step omits setup-node's cache input.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify version matches release tag
        id: version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi
          echo "value=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm dist-tag ls @notionhq/lore | node -e '
            const fs = require("node:fs");
            const version = process.env.PACKAGE_VERSION;
            const published = fs
              .readFileSync(0, "utf8")
              .split(/\r?\n/)
              .some((line) => line.endsWith(": " + version));
          '; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published != 'true'
        run: npm ci

      - name: Build
        if: steps.registry.outputs.published != 'true'
        run: npm run build

      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: npm publish
