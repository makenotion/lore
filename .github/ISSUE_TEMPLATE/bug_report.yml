name: Bug report
description: Report something that is not working as expected.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include Notion API tokens, bearer
        tokens, private vault content, exploit details, or other secrets in a
        public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence of commands or actions that reproduces the bug.
      placeholder: |
        1. Run `...`
        2. Configure `...`
        3. Observe `...`
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      multiple: true
      options:
        - CLI
        - MCP server
        - MCP tools
        - Hooks or background jobs
        - Notion vault setup or schema
        - Auth
        - Evals
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lore version or commit
      description: Paste `lore --version`, package version, or commit SHA if available.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node version, package manager, assistant host, and relevant non-secret config.
      placeholder: |
        - OS:
        - Node:
        - npm:
        - Assistant host:
        - Auth source, without token values (for example `NOTION_API_TOKEN` with a PAT, or ntn auth file present):
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Redact tokens, page content, and private workspace data before pasting logs.
      render: shell
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, screenshots, suspected cause, or related issues.
